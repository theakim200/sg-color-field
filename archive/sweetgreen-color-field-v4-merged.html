<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweetgreen Color Field (v4, merged layout)</title>
<meta name="description" content="Explore new color without leaving the Sweetgreen world.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 2a14 14 0 1 1-14 14V2z%27 fill=%27%2300A810%27/%3E%3C/svg%3E">
<style>
@font-face { font-family: "GT America Compressed"; src: url("../fonts/GTAmerica-Compressed-Light-Italic-Trial.otf") format("opentype"); font-weight: 300; font-style: italic; font-display: swap; }
@font-face { font-family: "GT America Compressed"; src: url("../fonts/GTAmerica-Compressed-Bold-Trial.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: "GT America Compressed"; src: url("../fonts/GTAmerica-Compressed-Bold-Italic-Trial.otf") format("opentype"); font-weight: 700; font-style: italic; font-display: swap; }
@font-face { font-family: "GT America Compressed"; src: url("../fonts/GTAmerica-Compressed-Black-Trial.otf") format("opentype"); font-weight: 900; font-style: normal; font-display: swap; }
@font-face { font-family: "GT America Compressed"; src: url("../fonts/GTAmerica-Compressed-Black-Italic-Trial.otf") format("opentype"); font-weight: 900; font-style: italic; font-display: swap; }

:root {
  --ev: #00A810;   /* Evergreen, PANTONE 2423 C */
  --ink: #111111;
  /* iOS system grays */
  --bg: #EEEEF4;
  --fill: #F2F2F7;
  --fill-2: #E5E5EA;
  --fill-3: #D1D1D6;
  --gray-4: #AEAEB2;
  --muted: #8E8E93;
  --muted-2: #636366;
  --tint: transparent; /* set from the dominant color: a faint wash behind the stage */

  --shadow-card: 0 1px 2px rgba(0, 0, 0, .05), 0 10px 30px rgba(0, 0, 0, .08);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .06);
  --shadow-raised: 0 1px 1px rgba(0, 0, 0, .06), 0 3px 10px rgba(0, 0, 0, .14);
  --hair: 0 0 0 .5px rgba(0, 0, 0, .18); /* only for small color dots, so white stays visible */
  --r-card: 24px; --r-tile: 14px; --r-sm: 10px;

  /* Display: GT America Compressed (Trial: Bold / Black only). Text: system sans (SF on Apple devices).
     When a lighter GT America cut is available, set --font-text to it. */
  --font-display: "GT America Compressed", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.4 var(--font-text); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; margin: 0; letter-spacing: .005em; }
:focus-visible { outline: 3px solid rgba(0, 168, 16, .5); outline-offset: 2px; }
input { font: inherit; color: inherit; }

/* frame: three columns; the stage is the center of attention */
.app { height: 100vh; height: 100dvh; display: grid; position: relative; overflow: hidden; gap: 0 16px; padding: 0 16px 16px;
  grid-template-columns: minmax(296px, 22vw) minmax(0, 1fr) minmax(320px, 25vw); grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top top" "left stage right"; }
.app::before { content: ""; position: absolute; inset: 0; background: radial-gradient(55% 65% at 50% 55%, var(--tint), transparent 70%); transition: background .5s; pointer-events: none; }
.top { grid-area: top; display: flex; align-items: center; justify-content: space-between; gap: 20px; margin: 14px -2px 14px; padding: 12px 22px; border-radius: 24px; background: rgba(255, 255, 255, .82); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); box-shadow: var(--shadow-card); position: relative; z-index: 5; }
.brand b { display: block; font: 700 25px/1 var(--font-display); }
.brand small { color: var(--muted); font-size: 12.5px; }
.nav { display: flex; gap: 6px; }
.nav button { font-size: 17px; font-weight: 500; padding: 6px 16px; border-radius: 99px; color: var(--ink); transition: background .2s; }
.nav button:hover { background: var(--fill); } .nav button.on { background: var(--fill-2); }

/* shared bits */
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.tag-good { background: rgba(0, 168, 16, .16); color: var(--ink); }
.tag-info { background: var(--fill); color: var(--muted-2); }
.tag-warn { background: var(--fill-2); color: var(--ink); }
.tag-bad { background: var(--ink); color: #fff; }
.mono { font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.btn { background: var(--fill); padding: 7px 15px; border-radius: 99px; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; transition: background .15s, transform .1s; }
.btn:hover { background: var(--fill-2); } .btn:active { transform: scale(.97); }
.btn-primary { background: var(--ink); color: #fff; } .btn-primary:hover { background: #333; }
.mini { background: var(--fill); padding: 2px 10px; border-radius: 99px; font-size: 11.5px; font-weight: 600; color: var(--ink); }
.mini:hover { background: var(--fill-2); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.chip i { width: 13px; height: 13px; border-radius: 50%; box-shadow: var(--hair); }
.sub { font: 600 11.5px var(--font-text); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; margin: 0; cursor: grab; min-width: 0; height: 28px; }
input[type=range]:active { cursor: grabbing; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: var(--fill-3); border-radius: 4px; }
input[type=range]::-moz-range-track { height: 4px; background: var(--fill-3); border-radius: 4px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; border-radius: 50%; background: #fff; margin-top: -11px; box-shadow: var(--shadow-raised); }
input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border: 0; border-radius: 50%; background: #fff; box-shadow: var(--shadow-raised); }

/* cards */
.col-left, .col-right { position: relative; z-index: 2; min-height: 0; display: flex; flex-direction: column; gap: 10px; overflow: auto; scrollbar-width: none; padding: 2px 2px 4px; margin: -2px; }
.col-left::-webkit-scrollbar, .col-right::-webkit-scrollbar { display: none; }
.col-left { grid-area: left; } .col-right { grid-area: right; }
.card { background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border-radius: var(--r-card); box-shadow: var(--shadow-card); padding: 14px; display: flex; flex-direction: column; gap: 10px; flex: none; min-width: 0; }
.card-head { display: flex; gap: 10px; align-items: center; }
.card-head h2 { font-size: 21px; line-height: 1.05; }
.card-head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; line-height: 1.3; }
.num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font: 600 13px var(--font-text); }
.num-sm { font-size: 10.5px; }

/* 1. expression */
.bal-row { display: flex; align-items: center; gap: 12px; background: var(--fill); border-radius: var(--r-tile); padding: 10px 14px; }
.bal-end { font: 700 17px var(--font-display); color: var(--muted); }
#balance { flex: 1; }
.bal-zones { display: flex; margin: 6px 14px 0 38px; }
.bal-zones .zone { flex: 1; text-align: center; font-size: 10.5px; line-height: 1.3; color: var(--gray-4); padding: 1px 0; }
.bal-zones .zone.on { color: var(--ink); font-weight: 700; }
.layouts { display: flex; flex-direction: column; gap: 2px; background: var(--fill); padding: 3px; border-radius: var(--r-tile); }
.layouts:empty { display: none; }
.layout { display: flex; align-items: center; gap: 10px; text-align: left; border-radius: 11px; padding: 5px 10px; font-size: 12.5px; transition: background .2s, box-shadow .2s; }
.layout.on { background: #fff; box-shadow: var(--shadow-sm); }
.layout .dots { display: flex; gap: 3px; flex: none; }
.layout .dots i { width: 13px; height: 13px; border-radius: 50%; box-shadow: var(--hair); }
.layout .lab { flex: 1 1 100px; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layout .lead { display: block; font-size: 10.5px; font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.layout .lead:empty { display: none; }
.count-note { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }

/* 2. explore */
.card-explore { flex: 1 1 auto; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--fill); padding: 3px; border-radius: 99px; align-self: flex-start; }
.tabs[hidden] { display: none; }
.tabs button { padding: 4px 13px 4px 8px; border-radius: 99px; display: flex; align-items: center; gap: 6px; color: var(--muted-2); font-size: 12.5px; font-weight: 500; transition: background .2s, box-shadow .2s; }
.tabs button i { width: 13px; height: 13px; border-radius: 50%; box-shadow: var(--hair); }
.tabs button.on { background: #fff; color: var(--ink); box-shadow: var(--shadow-sm); }
.field-wrap { position: relative; border-radius: var(--r-tile); overflow: hidden; background: var(--fill); box-shadow: var(--shadow-sm); flex: 1 1 96px; min-height: 96px; }
#field { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
.marker, .ev-marker { position: absolute; width: 24px; height: 24px; margin: -12px 0 0 -12px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px #fff, 0 3px 10px rgba(0, 0, 0, .35); pointer-events: none; }
.ev-marker { width: 12px; height: 12px; margin: -6px 0 0 -6px; box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0, 0, 0, .3); }
.ev-marker span { position: absolute; left: 14px; top: -4px; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink); background: rgba(255, 255, 255, .88); padding: 2px 6px; border-radius: 6px; box-shadow: var(--shadow-sm); }
.axis { position: absolute; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: rgba(0, 0, 0, .35); pointer-events: none; }
.axis-y { left: 8px; top: 6px; } .axis-x { right: 8px; bottom: 6px; }
.slider-body { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
.slider-body input { flex: 1; }
.test-row { display: flex; gap: 8px; }
.test-row input { flex: 1; min-width: 0; padding: 8px 12px; border-radius: var(--r-sm); border: 0; background: var(--fill); font-size: 13px; }
.test-row input::placeholder { color: var(--gray-4); }
.test-row input:focus { outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(0, 168, 16, .35), var(--shadow-sm); }
.test-msg { margin-top: 6px; font-size: 12px; color: var(--muted-2); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.test-msg:empty { display: none; }
.combo { background: var(--fill); border-radius: var(--r-tile); padding: 8px 12px; display: flex; flex-direction: column; gap: 5px; }
.combo p { margin: 0; font-size: 12.5px; color: var(--muted-2); }

/* 2.5 counterparts accordion */
.card-cp { gap: 10px; }
.cp-head { justify-content: flex-start; }
.cp-head > div { flex: 1; min-width: 0; }
.cp-toggle { flex: none; }
.cp-body[hidden] { display: none; }
.recs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.rec { text-align: left; border-radius: 10px; padding: 3px; min-width: 0; display: flex; flex-direction: column; gap: 3px; transition: background .2s, box-shadow .2s, transform .1s; }
.rec:hover { background: var(--fill); } .rec:active { transform: scale(.97); }
.rec.on { background: #fff; box-shadow: var(--shadow-raised); }
.rec-sw { height: 30px; border-radius: 8px; position: relative; overflow: hidden; }
.rec-sw i { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; }
.rec b { font-size: 10px; font-weight: 600; letter-spacing: 0; text-align: center; }
.cp-invite { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted-2); }

/* stage */
.stage { grid-area: stage; position: relative; z-index: 1; min-height: 0; min-width: 0; display: grid; place-items: stretch center; padding: 0 6px; }
.stage-inner { width: min(100%, 540px); min-height: 0; display: flex; flex-direction: column; }
.stack-wrap { flex: 1; min-height: 160px; display: flex; gap: 10px; }
.stack { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.stack .slot, .stack .empty { flex: 0 1 0; min-height: 0; margin: 0; padding: 0; overflow: visible; border-radius: 28px; opacity: 0; transition: flex-grow .5s cubic-bezier(.3, .7, .2, 1), margin .4s, opacity .25s, height .4s, box-shadow .25s, transform .25s; }
.stack .slot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; cursor: pointer; position: relative; box-shadow: 0 6px 18px rgba(0, 0, 0, .10); }
.stack .slot.on { opacity: 1; margin-top: 12px; }
.stack .slot.first { margin-top: 0; }
.stack .slot.sel { box-shadow: 0 18px 40px rgba(0, 0, 0, .30); transform: scale(1.014); z-index: 1; }
.stack .slot:not(.sel):hover { box-shadow: 0 10px 26px rgba(0, 0, 0, .18); }
.stack .slot-e { cursor: default; }
.stack .empty { flex: none; height: 0; background: var(--fill-2); border-radius: 99px; }
.stack .empty.on { opacity: 1; height: 8px; }
.stack .empty[data-empty=top].on { margin-bottom: 12px; } .stack .empty[data-empty=bottom].on { margin-top: 12px; }
.slot .b-role { position: absolute; top: 14px; left: 16px; display: flex; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.slot .b-role em { font-style: normal; background: rgba(255, 255, 255, .24); padding: 2px 9px; border-radius: 99px; }
.slot .b-label { font: 700 clamp(22px, 2.6vw, 40px)/1.05 var(--font-display); text-transform: uppercase; letter-spacing: .01em; }
.slot .b-hex { font-size: 13px; font-weight: 500; opacity: .8; }
.stack .slot.small .b-label { font-size: 24px; }
.stack .slot.compact { flex-direction: row; gap: 10px; } .stack .slot.compact .b-label { font-size: 17px; } .stack .slot.compact .b-hex, .stack .slot.compact .b-role { display: none; }
/* usage guidance bubble: appears on hover / focus (and on the selected block on touch screens) */
.slot .pop { position: absolute; right: 16px; top: 50%; transform: translateY(-50%) scale(.96); width: min(42%, 214px); padding: 10px; border-radius: 18px; background: rgba(255, 255, 255, .88); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--ink); box-shadow: 0 8px 28px rgba(0, 0, 0, .22); text-align: left; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; display: flex; flex-direction: column; gap: 6px; z-index: 3; }
.slot .pop .tags { flex-direction: column; align-items: flex-start; gap: 4px; }
.slot .pop .tag { white-space: normal; font-size: 11px; }
.slot .pop p { margin: 0; font-size: 11.5px; line-height: 1.3; color: var(--muted-2); }
.slot:hover .pop, .slot:focus-visible .pop { opacity: 1; transform: translateY(-50%) scale(1); }
.slot .b-label, .slot .b-hex { transition: transform .25s cubic-bezier(.3, .7, .2, 1); }
.stack .slot:not(.small):not(.compact):hover .b-label, .stack .slot:not(.small):not(.compact):hover .b-hex, .stack .slot:not(.small):not(.compact):focus-visible .b-label, .stack .slot:not(.small):not(.compact):focus-visible .b-hex { transform: translateX(-23%); }
@media (hover: none) { .slot.sel .pop { opacity: 1; transform: translateY(-50%) scale(1); } .stack .slot.sel:not(.small):not(.compact) .b-label, .stack .slot.sel:not(.small):not(.compact) .b-hex { transform: translateX(-23%); } }
.stack .slot.small .pop, .stack .slot.compact .pop { display: none; }
.ax-line { flex: none; width: 1.5px; background: var(--fill-3); position: relative; margin: 6px 4px 6px 0; border-radius: 2px; }
.ax-line::before, .ax-line::after { content: ""; position: absolute; left: -3.25px; border: 4px solid transparent; }
.ax-line::before { top: -3px; border-bottom: 6px solid var(--fill-3); border-top: 0; }
.ax-line::after { bottom: -3px; border-top: 6px solid var(--fill-3); border-bottom: 0; }

/* 4. apply */
.crows { display: flex; flex-direction: column; gap: 7px; }
.crow { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 10px; align-items: stretch; border-radius: var(--r-tile); padding: 8px; background: var(--fill); }
.crow-sw { min-height: 46px; border-radius: 9px; box-shadow: var(--hair); }
.crow-title { display: flex; align-items: baseline; gap: 7px; }
.crow-title b { font: 700 16px var(--font-display); letter-spacing: .01em; } .crow-title span { font-size: 11.5px; color: var(--muted); }
.crow-vals { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 1px 8px; margin-top: 3px; }
.val { display: flex; align-items: baseline; gap: 6px; text-align: left; font-size: 12px; font-weight: 500; min-width: 0; padding: 1px 0; }
.val span { color: var(--muted); font-size: 9.5px; font-weight: 600; width: 33px; flex: none; text-transform: uppercase; letter-spacing: .03em; }
.val code { font: inherit; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.val:hover code { text-decoration: underline; }
.crow-tags { margin-top: 4px; }
.matrix { display: grid; gap: 4px; align-items: center; }
.mx-h { font-size: 10px; color: var(--muted); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.1; }
.mx-h i { width: 12px; height: 12px; border-radius: 50%; box-shadow: var(--hair); }
.mx-r { font-size: 11.5px; color: var(--muted-2); display: flex; align-items: center; gap: 6px; min-width: 0; }
.mx-r i { flex: none; width: 12px; height: 12px; border-radius: 50%; box-shadow: var(--hair); }
.mx-r span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mx { position: relative; height: clamp(26px, 4vh, 36px); border-radius: 9px; display: grid; place-items: center; font: 700 16px var(--font-display); }
.mx.same { background: repeating-linear-gradient(45deg, var(--fill), var(--fill) 4px, #fafafc 4px, #fafafc 8px); }
.mx .m { position: absolute; right: 4px; bottom: 1px; font: 700 9.5px var(--font-text); }
.mx.lvl-fail .a { opacity: .4; text-decoration: line-through; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--muted); }
.legend b { font-weight: 700; color: var(--ink); }
.exports { display: flex; flex-wrap: wrap; gap: 6px; }
.exports .btn { padding: 6px 10px; font-size: 12px; }
.crows.dense .crow-tags { display: none; }

/* sheets (Technical, About, Library) */
.drawer { position: fixed; top: 84px; right: 14px; bottom: 14px; width: min(440px, calc(100vw - 20px)); background: rgba(255, 255, 255, .95); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); border-radius: 26px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25), 0 2px 8px rgba(0, 0, 0, .08); z-index: 30; display: flex; flex-direction: column; }
.drawer[hidden] { display: none; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 10px; }
.drawer-head h3 { font-size: 26px; }
.drawer-body { flex: 1; overflow: auto; padding: 0 20px 22px; display: flex; flex-direction: column; gap: 16px; }
.drawer h4 { font: 600 11.5px var(--font-text); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 7px; }
.tcard { border-radius: var(--r-tile); padding: 10px 12px; background: var(--fill); margin-bottom: 8px; }
.tcard-h { display: flex; align-items: center; gap: 8px; font: 700 16px var(--font-display); }
.tcard-h i { width: 16px; height: 16px; border-radius: 50%; box-shadow: var(--hair); }
.tcard-h .mono { font: 500 12px var(--font-text); }
.bar { display: grid; grid-template-columns: 104px 1fr 36px; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted-2); }
.bar > i { height: 5px; border-radius: 4px; background: var(--fill-2); position: relative; overflow: hidden; }
.bar > i::after { content: ""; position: absolute; inset: 0; width: var(--w); background: var(--ink); border-radius: 4px; }
.bar em { font-style: normal; font-size: 11.5px; text-align: right; }
.ttable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
.ttable td, .ttable th { padding: 4px 5px; text-align: right; } .ttable th { color: var(--muted); font-weight: 600; } .ttable tr + tr td { box-shadow: 0 -1px 0 rgba(0, 0, 0, .05); }
.ttable th:first-child, .ttable td:first-child { text-align: left; }
#slice { width: 100%; border-radius: var(--r-tile); background: #fff; box-shadow: var(--shadow-sm); }
.drawer p { margin: 0; font-size: 13px; color: var(--muted-2); line-height: 1.5; }
.drawer .lede { font: 700 22px/1.15 var(--font-display); color: var(--ink); }
.about-territories { display: grid; gap: 8px; }
.about-t { background: var(--fill); border-radius: var(--r-tile); padding: 10px 12px; }
.about-t b { font: 700 17px var(--font-display); display: flex; align-items: center; gap: 8px; }
.about-t b i { width: 14px; height: 14px; border-radius: 50%; box-shadow: var(--hair); }
.lib-empty { background: var(--fill); border-radius: var(--r-tile); padding: 18px; text-align: center; }

<script>
/* Color math: OKLCH <-> sRGB, gamut fitting, distance, contrast (WCAG + APCA).
   Pure functions, no DOM. Attaches to the global SG namespace (works in browser and Node). */
(function (root) {
  const SG = (root.SG = root.SG || {});
  const RAD = Math.PI / 180;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ramp = (x, a, b) => clamp((x - a) / (b - a), 0, 1);
  const hueDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

  const toLinear = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const fromLinear = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);

  function oklchToLinear({ L, C, h }) {
    const a = C * Math.cos(h * RAD), b = C * Math.sin(h * RAD);
    const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    const s = Math.pow(L - 0.0894841775 * a - 1.291485548 * b, 3);
    return [
      4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
    ];
  }

  function linearToOklch([r, g, b]) {
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
    const a = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
    const bb = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
    const C = Math.hypot(a, bb);
    let h = Math.atan2(bb, a) / RAD;
    if (h < 0) h += 360;

  const inGamut = (lin, eps = 1e-4) => lin.every((v) => v >= -eps && v <= 1 + eps);

  /** Reduce chroma (hue and lightness fixed) until the color fits inside sRGB. */

    if (inGamut(oklchToLinear(c))) return { L: c.L, C: c.C, h: c.h };
    let lo = 0, hi = c.C;
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) / 2;
      if (inGamut(oklchToLinear({ L: c.L, C: mid, h: c.h }))) lo = mid; else hi = mid;
    }
    return { L: c.L, C: lo, h: c.h };
  }

  function oklchToRgb8(c) {
    const f = fitToGamut(c);
    return oklchToLinear(f).map((v) => Math.round(clamp(fromLinear(clamp(v, 0, 1)), 0, 1) * 255));
  }

  const hex2 = (n) => n.toString(16).padStart(2, '0');
  const toHex = (c) => '#' + oklchToRgb8(c).map(hex2).join('').toUpperCase();

  function parseHex(hex) {
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return null;
    let s = m[1];
    if (s.length === 3) s = s.split('').map((x) => x + x).join('');

    const rgb = parseHex(hex);
    return rgb ? linearToOklch(rgb.map((v) => toLinear(v / 255))) : null;
  }

  function deltaE(a, b) {
    const ax = a.C * Math.cos(a.h * RAD), ay = a.C * Math.sin(a.h * RAD);
    const bx = b.C * Math.cos(b.h * RAD), by = b.C * Math.sin(b.h * RAD);

    const Y = (hex) => { const [r, g, b] = parseHex(hex).map((v) => toLinear(v / 255)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
    const [hi, lo] = [Y(fgHex), Y(bgHex)].sort((x, y) => y - x);
    return (hi + 0.05) / (lo + 0.05);
  }

  /** APCA-W3 0.98G-4g. Returns signed Lc (positive = dark text on light bg). */
  function apca(fgHex, bgHex) {
    const Y = (hex) => {
      const [r, g, b] = parseHex(hex).map((v) => Math.pow(v / 255, 2.4));
      const y = 0.2126729 * r + 0.7151522 * g + 0.072175 * b;
      return y >= 0.022 ? y : y + Math.pow(0.022 - y, 1.414);

    if (Math.abs(s) < 0.1) return 0;
    return (s > 0 ? s - 0.027 : s + 0.027) * 100;

  /** Naive device-independent CMYK. Indicative only; real print values need a press profile. */
  function cmyk(hex) {
    const [r, g, b] = parseHex(hex).map((v) => v / 255);
    const k = 1 - Math.max(r, g, b);
    if (k >= 1) return [0, 0, 0, 100];
    return [(1 - r - k) / (1 - k), (1 - g - k) / (1 - k), (1 - b - k) / (1 - k), k].map((v) => Math.round(v * 100));
  }

  const oklchString = (c) => `oklch(${(c.L * 100).toFixed(1)}% ${c.C.toFixed(3)} ${c.h.toFixed(1)})`;

  SG.color = { clamp, lerp, ramp, hueDiff, oklchToLinear, linearToOklch, fitToGamut, oklchToRgb8, toHex, parseHex, fromHex, deltaE, wcag, apca, cmyk, oklchString };

<script>
/* Territory definitions: Grounded and Ripe as irregular, hue-dependent regions of OKLCH space.
   Each territory is a table of keypoints every 30 degrees of hue: [hue, Lmin, Lmax, Cmin, Cmax].
   Bounds between keypoints are interpolated, so the region is NOT one rectangle.

   PROVISIONAL: these values are a seed, set from general color knowledge, not from Sweetgreen's
   approved samples. Methodology: Visual -> Sample -> Measure -> Rule. Replace the tables with
   values measured from the approved/borderline/outside sample set (see README). */

  const SG = root.SG;
  const { clamp, lerp, hueDiff, fitToGamut, fromHex } = SG.color;

  const CONFIG = {
    evergreenHex: '#00A810', // PANTONE 2423 C, RGB 0/168/16. Single source for the brand anchor
    inkHex: '#111111',        // dark type color used in contrast tests (assumed; confirm)
    whiteHex: '#FFFFFF',
    coreDepth: 0.15,          // inside by >= 15% of the local range = "core"; 0..15% = "edge"
  };

    [30,  0.38, 0.64, 0.065, 0.135],
    [60,  0.45, 0.72, 0.065, 0.115],
    [90,  0.55, 0.80, 0.065, 0.110],
    [120, 0.45, 0.76, 0.055, 0.120],
    [150, 0.38, 0.72, 0.050, 0.105],
    [180, 0.38, 0.70, 0.040, 0.085],
    [210, 0.38, 0.72, 0.040, 0.085],
    [240, 0.36, 0.70, 0.040, 0.095],
    [270, 0.36, 0.66, 0.045, 0.105],
    [300, 0.36, 0.64, 0.050, 0.105],
    [330, 0.37, 0.63, 0.055, 0.115],
  ];

    [0,   0.56, 0.72, 0.170, 0.250],
    [30,  0.62, 0.73, 0.160, 0.225],
    [60,  0.70, 0.80, 0.135, 0.175],
    [90,  0.82, 0.91, 0.110, 0.160],
    [120, 0.70, 0.88, 0.150, 0.210],
    [150, 0.68, 0.86, 0.150, 0.220],
    [180, 0.66, 0.84, 0.100, 0.135],
    [210, 0.60, 0.78, 0.090, 0.130],
    [240, 0.55, 0.72, 0.120, 0.160],
    [270, 0.46, 0.64, 0.160, 0.260],
    [300, 0.50, 0.70, 0.150, 0.280],
    [330, 0.56, 0.76, 0.190, 0.270],
  ];

  const TERRITORIES = {
    grounded: {
      key: 'grounded', label: 'Grounded', table: GROUNDED,
      character: ['Rooted', 'Substantial', 'Calm', 'Tempered', 'Elemental'],
      slider: ['Tempered', 'Fuller'],
      blurb: 'Earth, terrain, minerals, water, atmosphere. Tempered, not muted.',
    },
    ripe: {
      key: 'ripe', label: 'Ripe', table: RIPE,
      character: ['Vibrant', 'Expressive', 'Juicy', 'Abundant', 'Full'],
      slider: ['Bright', 'Heightened'],
      blurb: 'Fruit, flowers, crops, blooms. Heightened, not just saturated.',

<script>
/* Spectrum rules: which color-chip combinations are allowed at each point of the
   Grounded <-> Ripe balance, and how much visual area each chip gets.

   Notation: G = Grounded chip, E = Evergreen (always present, never counted), R = Ripe chip.
   At most 3 chips excluding Evergreen. Three chips are possible but not recommended.

   The balance value p is the Ripe weight: 0 = Grounded end, 1 = Ripe end (slider runs G -> R).
   Zones are listed from the Grounded end to the Ripe end. In each zone the default layout is
   the first recommended one; "lead" says which territory is visually larger there. */
(function (root) {
  const SG = root.SG;

  const MAX_CHIPS = 3;
  const RECOMMENDED_MAX = 2;

  const ZONES = [
    { id: 'z1', min: 0.0, lead: 'grounded', name: 'Grounded end', combos: ['GGE', 'GE'] },
    { id: 'z2', min: 0.2, lead: 'grounded', name: 'Grounded to center', combos: ['GGER', 'GER'] },
    { id: 'z3', min: 0.4, lead: null, name: 'Center', combos: ['GER'] },
    { id: 'z4', min: 0.6, lead: 'ripe', name: 'Center to Ripe', combos: ['GERR', 'GER'] },
    { id: 'z5', min: 0.8, lead: 'ripe', name: 'Ripe end', combos: ['ERR', 'ER'] },
  ];

  function zoneIndex(p) {
    let idx = 0;
    for (let i = 0; i < ZONES.length; i++) if (p >= ZONES[i].min) idx = i;
    return idx;
  }

  /** Index of the layout used in a zone until the user picks another: the first recommended one. */
  function defaultPick(zone) {
    const i = zone.combos.findIndex((c) => parse(c).recommended);
    return i < 0 ? 0 : i;
  }

  function parse(code) {
    const g = (code.match(/G/g) || []).length, r = (code.match(/R/g) || []).length;
    return { g, r, chips: g + r, recommended: g + r <= RECOMMENDED_MAX, valid: g + r <= MAX_CHIPS && g + r >= 1 && code.includes('E') };
  }

  /** Chip ids present in a combo, e.g. 'GGER' -> ['g1','g2','r1']. */
  function ids(code) {
    const { g, r } = parse(code), out = [];
    for (let i = 1; i <= g; i++) out.push('g' + i);
    for (let i = 1; i <= r; i++) out.push('r' + i);
    return out;
  }

  function label(code) {
    const { g, r } = parse(code), part = (n, name) => (n === 0 ? null : n === 1 ? name : `${n} ${name}`);
    return [part(g, 'Grounded'), 'Evergreen', part(r, 'Ripe')].filter(Boolean).join(' + ');
  }

  // Visual area of a territory as a function of its share of the balance. Evergreen is fixed at 1,
  // so it reads as the anchor in the middle of the range and gives way at the extremes.
  const areaOf = (w) => 0.25 + 0.95 * w;
  const SPLIT = [1, 0.45]; // two chips in one territory: the lead keeps the full area, the companion is a smaller second voice

  /** Effective Grounded / Ripe weights. The center zone is exactly balanced; elsewhere they follow the handle. */
  function weights(p) {
    const w = ZONES[zoneIndex(p)].lead === null ? 0.5 : p;
    return { g: 1 - w, r: w };
  }

  function areas(p, code) {
    const { g, r } = parse(code), w = weights(p), out = { e: 1 };
    const spread = (prefix, n, share) => { const total = areaOf(share); if (n === 1) out[prefix + 1] = total; else if (n === 2) SPLIT.forEach((k, i) => (out[prefix + (i + 1)] = total * k)); };
    spread('g', g, w.g);
    spread('r', r, w.r);
    return out;

<script>

      distinctRange: [0.08, 0.22],   // OKLab distance that reads as "its own color"
      separationRange: [0.05, 0.25], // |dL| to Evergreen

    // read well; the middle bands are the awkward "almost related" zone.
    hueHarmony: [[0, 0.9], [40, 0.9], [70, 0.6], [100, 0.7], [130, 0.85], [160, 1], [180, 1]],
    pair: { w: { distinct: 0.35, spread: 0.20, chromaBalance: 0.20, hue: 0.25 }, distinctRange: [0.10, 0.28] },
    trio: { relG: 0.3, relR: 0.3, pair: 0.4 },

    if (parts.separation < 0.4 && parts.dominance >= 0.6) notes.push('Similar depth to Evergreen; pair with care.');
    if (dh >= 150 && parts.distinct >= 0.5) notes.push('An intentional contrast to Evergreen.');

<script>
/* Front end. Translates the engine's technical results into brand language.
   Layout (left to right):
     left   = 1 Choose an expression, 2 Explore color, 2.5 Explore counterparts (opens/closes)
     stage  = the colors, once, large. Hover a color for its usage guidance.
     right  = 4 Apply: values, which type works on which color, export, library
   Sheets from the top bar: About, Library, Technical (OKLCH, scores, contrast numbers).

(function () {
  const { color: C, territories: T, engine: E, spectrum: SP } = SG;

  const FIELD = { w: 360, h: 200, Ltop: 0.97, Lbot: 0.2 };

  seed.r2 = E.companion('ripe', seed.r1);

  const S = {
    p: 0.5, picks: {}, sheet: null, active: 'r1', cpOpen: false,
    chips: { ...seed },
    t: Object.fromEntries(CHIP_IDS.map((id) => [id, T.intensityOf(terrOf(id), seed[id])])),

    const ids = SP.ids(code), area = SP.areas(S.p, code), q = SP.parse(code);

  }

    $('#intensity').value = Math.round(S.t[S.active] * 100);
    drawField();

    const ev = E.evaluate(cur.chipItems.map((i) => ({ key: i.key, c: i.c }))), [lab, tone] = overallLabel(ev.score);
    $('#combo').innerHTML = `<span class="sub">This combination</span><div class="tags"><span class="tag tag-${tone}">${lab}</span></div><p>${ev.notes.slice(0, 2).join(' ') || 'Evergreen anchors the combination.'}</p>`;
  }

  function buildField(key, t) {
    const { w, h, Ltop, Lbot } = FIELD;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h);
    for (let x = 0; x < w; x++) {
      const hue = (x / w) * 360, b = T.bounds(key, hue);
      for (let y = 0; y < h; y++) {
        const L = Ltop - (y / (h - 1)) * (Ltop - Lbot), i = (y * w + x) * 4;
        const dL = Math.min(L - b.Lmin, b.Lmax - L) / (b.Lmax - b.Lmin);
        let ok = dL >= 0;
        if (ok) {
          const fit = C.fitToGamut({ L, C: b.Cmin + t * (b.Cmax - b.Cmin), h: hue });
          if (fit.C < b.Cmin * 0.92) ok = false; // not representable in sRGB at this hue/lightness
          else {
            const [r, g, bl] = C.oklchToRgb8(fit);
            img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = bl; img.data[i + 3] = Math.round(255 * C.clamp(dL / 0.06, 0.35, 1));
          }
        }
        if (!ok) { img.data[i] = 0; img.data[i + 1] = 0; img.data[i + 2] = 0; img.data[i + 3] = 14; }
      }
    }
    ctx.putImageData(img, 0, 0);
    return cv;
  }

  function drawField() {
    const key = activeKey(), t = S.t[S.active], cacheKey = key + ':' + t.toFixed(2);
    if (S.fieldKey !== cacheKey) { S.fieldBitmap = buildField(key, t); S.fieldKey = cacheKey; }
    const cv = $('#field'), ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.drawImage(S.fieldBitmap, 0, 0);
    const c = S.chips[S.active], { Ltop, Lbot } = FIELD, m = $('#marker');
    m.style.left = (c.h / 360) * 100 + '%';
    m.style.top = ((Ltop - c.L) / (Ltop - Lbot)) * 100 + '%';
    m.style.background = C.toHex(c);
    const ev = $('#ev-marker');
    ev.style.left = (T.evergreen.h / 360) * 100 + '%';
    ev.style.top = ((Ltop - T.evergreen.L) / (Ltop - Lbot)) * 100 + '%';
    ev.style.background = CONFIG.evergreenHex;
  }

  function setChip(id, c) { S.chips[id] = c; S.t[id] = T.intensityOf(terrOf(id), c); }

  function pickFromPointer(ev) {
    const key = activeKey(), r = $('#field').getBoundingClientRect(), { Ltop, Lbot } = FIELD;
    const h = C.clamp((ev.clientX - r.left) / r.width, 0, 0.9999) * 360;
    const L = Ltop - C.clamp((ev.clientY - r.top) / r.height, 0, 1) * (Ltop - Lbot);
    S.chips[S.active] = T.colorAt(key, h, L, S.t[S.active]); // clamps L into the territory at this hue
    schedule();
  }

  function testHex() {
    const msg = $('#test-msg'), c = C.fromHex($('#hex-test').value), key = activeKey(), id = S.active;
    if (!c) { msg.innerHTML = 'Enter a valid HEX, like <b>#E4572E</b>.'; return; }
    if (c.C < 0.02) c.h = S.chips[id].h; // a neutral has no hue; keep the current one
    const m = T.membership(c), mine = TERRITORIES[key].label;
    if (m.territory === key) { setChip(id, c); msg.innerHTML = `Inside ${mine}. Applied.`; fullRender(); return; }
    const other = m.territory && cur.ids.some((x) => terrOf(x) === m.territory) ? m.territory : null;
    const where = m.territory ? `That color belongs to ${TERRITORIES[m.territory].label}.` : 'That color sits outside the Sweetgreen territories.';
    S.pendingSnap = T.snapInto(key, c);
    msg.innerHTML = `${where} Nearest ${mine}: <span class="chip"><i style="background:${C.toHex(S.pendingSnap)}"></i>${C.toHex(S.pendingSnap)}</span>
      <button class="mini" data-action="snap">Use it</button>${other ? `<button class="mini" data-action="goto" data-v="${other[0]}1" data-hex="${C.toHex(c)}">Use as ${TERRITORIES[other].label}</button>` : ''}`;
  }

  /* ---------- 2.5 counterparts ---------- */
  function renderCounterparts() {
    $('#cp-toggle').textContent = S.cpOpen ? 'Close' : 'Open';
    $('#cp-toggle').setAttribute('aria-expanded', S.cpOpen);
    const body = $('#cp-body');
    body.hidden = !S.cpOpen;
    if (!S.cpOpen) return;
    if (cur.hasG && cur.hasR) {
      const from = activeKey(), to = from === 'grounded' ? 'ripe' : 'grounded', target = to[0] + '1';
      S.recs = E.recommend(S.chips[S.active], from, 6);
      body.innerHTML = `<div class="sub" style="margin-bottom:6px">${TERRITORIES[to].label} for ${cur.byId[S.active].label}</div>
        <div class="recs">${S.recs.map((r, i) => {
          const sp = E.spec(r.color), on = cur.byId[target] && cur.byId[target].hex === sp.hex;
          return `<button class="rec${on ? ' on' : ''}" data-action="rec" data-v="${i}" data-target="${target}" title="${r.reason}. Replaces ${cur.labelOf(target)}.">
            <span class="rec-sw" style="background:${sp.hex}"><i style="background:${CONFIG.evergreenHex}"></i></span>
            <b>${sp.hex.slice(1)}</b></button>`; }).join('')}</div>`;
    } else {
      const other = cur.hasG ? 'Ripe' : 'Grounded';
      body.innerHTML = `<div class="cp-invite"><span>Add a ${other} counterpart to see suggestions.</span><button class="btn" data-action="mix">Add ${other}</button></div>`;
    }
  }

  /* ---------- stage: the colors, once ---------- */
  function renderStage() {
    const stack = $('#stack');
    let first = true;
    ['r1', 'r2', 'e', 'g1', 'g2'].forEach((id) => {
      const el = $(`.slot[data-id=${id}]`, stack), it = cur.byId[id];
      if (!it) { el.classList.remove('on', 'first', 'sel'); el.style.flexGrow = 0; el.tabIndex = -1; return; }
      const isFirst = first, role = cur.roles[id]; first = false;
      const g = guidanceFor(it);
      el.classList.add('on'); el.classList.toggle('first', isFirst);
      el.classList.toggle('sel', S.active === id);
      el.classList.toggle('compact', it.area < 0.5);
      el.classList.toggle('small', it.area < 0.6);
      el.style.flexGrow = it.area; el.style.background = it.hex; el.style.color = inkOrWhite(it.hex); el.tabIndex = id === 'e' ? -1 : 0;
      el.setAttribute('aria-label', `${it.label}, ${it.hex}, ${ROLE_LABEL[role.role]}`);
      el.innerHTML = `<span class="b-role"><em>${ROLE_LABEL[role.role]}</em>${role.anchor ? '<em>Anchor</em>' : ''}</span>
        <span class="b-label">${it.label}</span><span class="b-hex">${it.hex}</span>
        <span class="pop" aria-hidden="true"><span class="tags">${g.tags.slice(0, 4).map(tagHtml).join('')}</span><p>${g.note}</p></span>`;
    });
    $('[data-empty=top]', stack).classList.toggle('on', !cur.hasR);
    $('[data-empty=bottom]', stack).classList.toggle('on', !cur.hasG);
  }

  /* ---------- 4. apply ---------- */
  const val = (label, text, copy, hint) => `<button class="val" data-action="copy" data-v="${copy ?? text}" title="${hint || 'Copy ' + label}"><span>${label}</span><code>${text}</code></button>`;

  function crow(o) {
    const s = o.spec, g = guidanceFor(o);
    return `<div class="crow"><span class="crow-sw" style="background:${o.hex}"></span><div style="min-width:0">
      <div class="crow-title"><b>${o.label}</b><span>${ROLE_LABEL[o.role]}${o.anchor ? ' · Anchor' : ''}</span></div>
      <div class="crow-vals">${val('HEX', s.hex)}${val('RGB', s.rgb.join(', '), `rgb(${s.rgb.join(', ')})`)}${val('CMYK', s.cmyk.join(' '), `cmyk(${s.cmyk.join(', ')})`, 'Indicative CMYK; confirm with press proofs')}${val('OKLCH', `${(s.oklch.L * 100).toFixed(1)}% ${s.oklch.C.toFixed(3)} ${s.oklch.h.toFixed(0)}`, s.oklchText)}</div>
      <div class="tags crow-tags">${tagHtml(g.tags[0])}</div></div></div>`;
  }

  function matrixHtml(order) {
    const { whiteHex, inkHex, evergreenHex } = CONFIG;
    const cols = [['White', whiteHex], ['Ink', inkHex], ['Evergreen', evergreenHex], ...cur.chipItems.map((c) => [c.label, c.hex])];
    const head = cols.map(([n, hex]) => `<div class="mx-h" title="${n} type"><i style="background:${hex}"></i></div>`).join('');
    const rows = order.map((o) => {
      const cells = cols.map(([n, hex]) => {
        if (hex.toUpperCase() === o.hex.toUpperCase()) return `<div class="mx same" title="Same color"></div>`;
        const r = E.contrastLevel(hex, o.hex), [lab, , mark] = LEVEL[r.level];
        return `<div class="mx lvl-${r.level}" style="background:${o.hex};color:${hex}" title="${n} on ${o.label}: ${lab}"><span class="a">Aa</span><span class="m">${mark}</span></div>`;
      }).join('');
      return `<div class="mx-r"><i style="background:${o.hex}"></i><span>${o.label}</span></div>${cells}`;
    }).join('');
    return `<div class="matrix" style="grid-template-columns:84px repeat(${cols.length},minmax(0,1fr))"><div></div>${head}${rows}</div>
      <div class="legend"><span><b>✓</b> Body text</span><span><b>L</b> Large text only</span><span><b>✕</b> Avoid</span><span>Columns: type color</span></div>`;
  }

  function renderApply() {
    $('#apply-body').innerHTML = `
      <div class="crows${cur.ranked.length >= 4 ? ' dense' : ''}">${cur.ranked.map(crow).join('')}</div>
      <div class="sub">Type on color</div>
      ${matrixHtml(cur.ranked)}
      <div class="exports">
        <button class="btn" data-action="copy-css">CSS variables</button>
        <button class="btn" data-action="copy-json">JSON</button>
        <button class="btn" data-action="lib-add">Add to library</button>
        <button class="btn btn-primary" data-action="copy-link">Copy link</button>
      </div>`;
    $('#apply-body').style.cssText = 'display:flex;flex-direction:column;gap:12px';
  }

  /* ---------- sheets: Technical, About, Library ---------- */
  const bar = (label, v) => `<div class="bar"><span>${label}</span><i style="--w:${Math.round(C.clamp(v, 0, 1) * 100)}%"></i><em>${v.toFixed(2)}</em></div>`;

  function techHtml() {
    const ev = E.evaluate(cur.chipItems.map((i) => ({ key: i.key, c: i.c })));
    const cards = cur.chipItems.map((it, i) => {
      const m = T.membership(it.c), r = ev.rels[i];
      return `<div class="tcard"><div class="tcard-h"><i style="background:${it.hex}"></i>${it.label} <span class="mono">${it.hex}</span></div>
        <div class="mono">${it.spec.oklchText} · CMYK≈ ${it.spec.cmyk.join(' ')} · RGB ${it.spec.rgb.join(', ')}<br>${depthPhrase(it.c, it.key)} · depth ${m.depth.toFixed(2)} (${m.status})</div>
        <div style="margin-top:6px">${bar('Evergreen fit', r.score)}${Object.entries(r.parts).map(([k, v]) => bar(k, v)).join('')}</div>
        <div class="mono">ΔE(OK) ${r.metrics.dE.toFixed(3)} · ΔL ${r.metrics.dL.toFixed(2)} · hue Δ ${r.metrics.dh.toFixed(0)}° · C ratio ${r.metrics.cRatio.toFixed(2)}</div>
        <div class="tags" style="margin-top:6px">${E.guidance(it.hex, it.c).tags.map(tagHtml).join('')}</div></div>`;
    }).join('');
    const gs = cur.chipItems.filter((i) => i.key === 'grounded'), rs = cur.chipItems.filter((i) => i.key === 'ripe');
    const pairs = [];
    gs.forEach((g) => rs.forEach((r) => pairs.push(`<div class="tcard"><div class="tcard-h">${g.label} ↔ ${r.label}</div>${Object.entries(E.pairCompat(g.c, r.c).parts).map(([n, v]) => bar(n, v)).join('')}</div>`)));
    const fgList = [['White', CONFIG.whiteHex], ['Ink', CONFIG.inkHex], ['Evergreen', CONFIG.evergreenHex], ...cur.chipItems.map((c) => [c.label, c.hex])];
    const rowsT = cur.items.map((o) => `<tr><td>${o.label}</td>${fgList.map(([n, hex]) => {
      if (hex.toUpperCase() === o.hex.toUpperCase()) return '<td>–</td>';
      const r = E.contrastLevel(hex, o.hex); return `<td title="${n} on ${o.label}">${r.ratio.toFixed(1)} / ${Math.abs(r.lc).toFixed(0)}</td>`; }).join('')}</tr>`).join('');
    return `
      <p>Balance ${S.p.toFixed(2)} (0 = Grounded end, 1 = Ripe end) · zone ${cur.z.id} · layout ${cur.code} · ${cur.q.chips} chips${cur.q.recommended ? '' : ' (not recommended)'} · overall ${ev.score.toFixed(2)}</p>
      <section><h4>Each color against Evergreen</h4>${cards}</section>
      ${pairs.length ? `<section><h4>Grounded ↔ Ripe</h4>${pairs.join('')}</section>` : ''}
      <section><h4>Contrast: WCAG ratio / APCA Lc</h4>
        <table class="ttable"><tr><th>bg \\ type</th>${fgList.map(([n]) => `<th>${n.slice(0, 5)}</th>`).join('')}</tr>${rowsT}</table>
        <p style="margin-top:4px">Body text needs ≥ ${E.PARAMS.contrast.bodyWcag}:1 and Lc ≥ ${E.PARAMS.contrast.bodyLc}; large text ≥ ${E.PARAMS.contrast.largeWcag}:1 and Lc ≥ ${E.PARAMS.contrast.largeLc}.</p></section>
      <section><h4>Territory slice at hue ${S.chips[S.active].h.toFixed(0)}°</h4><canvas id="slice" width="360" height="300"></canvas>
        <p>Territories are irregular, hue-dependent regions (shaded boxes), not one universal L/C range. Shaded area is the sRGB gamut. Evergreen is plotted at its own chroma and lightness.</p></section>
      <p>Territory boundaries are provisional until calibrated against Sweetgreen's approved samples. CMYK values are indicative only; confirm with press proofs.</p>`;
  }

  function aboutHtml() {
    const dot = (hex) => `<i style="background:${hex}"></i>`;
    return `
      <p class="lede">A living color system that moves from Grounded to Ripe, always anchored by Evergreen.</p>
      <p>Sweetgreen's color is built around three territories: Grounded, Evergreen, Ripe. It is inspired by the cycle of growth, but it is a spectrum of expression and energy rather than a literal “soil, plant, fruit”.</p>
      <div class="about-territories">
        <div class="about-t"><b>${dot(C.toHex(seed.g1))}Grounded</b><p>Rooted, substantial, calm, tempered, elemental. Earth, terrain, minerals, water, atmosphere. A grounded color can be bright; it is tempered, not muted.</p></div>
        <div class="about-t"><b>${dot(CONFIG.evergreenHex)}Evergreen</b><p>The constant and most recognizable brand color. It anchors every expression while the colors around it change.</p></div>
        <div class="about-t"><b>${dot(C.toHex(seed.r1))}Ripe</b><p>Vibrant, expressive, juicy, abundant, full. Fruit, flowers, crops, blooms. Ripe is heightened, not simply saturated.</p></div>
      </div>
      <p><b style="color:var(--ink)">Grounded isn't muted. It's tempered. Ripe isn't simply saturated. It's heightened.</b></p>
      <p>There is no fixed secondary palette. Grounded and Ripe are territories: controlled but flexible areas of color from which colors are chosen for seasons, ingredients and collaborations. Choose the expression, select within the territory, anchor with Evergreen, and balance Grounded and Ripe as needed.</p>
      <p>This tool keeps the front end intuitive while a technical engine checks territory, the relationship to Evergreen, pairings, hierarchy and legibility behind the scenes. Open <b style="color:var(--ink)">Technical</b> to see the numbers.</p>
      <p>Territory boundaries are provisional until calibrated against approved Sweetgreen samples.</p>`;
  }

  function libraryHtml() {
    const list = loadLib();
    if (!list.length) return `<div class="lib-empty"><p>Nothing saved yet. Use <b style="color:var(--ink)">Add to library</b> in Apply to keep a combination.</p></div><p>Saved combinations stay in this browser only.</p>`;
    return list.map((it) => {
      const ids = SP.ids(it.code), hexes = [...ids.filter((x) => x[0] === 'g'), 'e', ...ids.filter((x) => x[0] === 'r')].map((id) => (id === 'e' ? CONFIG.evergreenHex : '#' + String(it.hex[id]).replace('#', '')));
      const lead = SP.ZONES[SP.zoneIndex(it.p)].lead;
      return `<div class="lib-item"><span class="lib-sw">${hexes.map((h) => `<i style="background:${h}"></i>`).join('')}</span>
        <div class="lib-meta"><b>${SP.label(it.code)}</b><span>${new Date(it.savedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}${lead ? ' · ' + (lead === 'grounded' ? 'Grounded-led' : 'Ripe-led') : ''}</span></div>
        <div class="lib-actions"><button class="mini" data-action="lib-open" data-v="${it.id}">Open</button><button class="mini" data-action="lib-del" data-v="${it.id}" aria-label="Delete">Delete</button></div></div>`;
    }).join('') + '<p>Saved combinations stay in this browser only.</p>';
  }

  function renderSheet() {
    const dr = $('#drawer');
    dr.hidden = !S.sheet;
    dr.style.top = Math.round($('.top').getBoundingClientRect().bottom + 8) + 'px'; // keep the top bar and its menu reachable
    $$('.nav button').forEach((b) => b.classList.toggle('on', b.dataset.v === S.sheet));
    if (!S.sheet) return;
    $('#drawer-title').textContent = { about: 'About', library: 'Library', technical: 'Under the hood' }[S.sheet];
    $('#drawer-body').innerHTML = S.sheet === 'technical' ? techHtml() : S.sheet === 'about' ? aboutHtml() : libraryHtml();
    if (S.sheet === 'technical') drawSlice();
  }

  function drawSlice() {
    const cv = $('#slice');
    if (!cv) return;
    const hue = S.chips[S.active].h, ctx = cv.getContext('2d'), W = cv.width, H = cv.height, Cmax = 0.33, img = ctx.createImageData(W, H);
    for (let x = 0; x < W; x++) for (let y = 0; y < H; y++) {
      const c = (x / W) * Cmax, L = 1 - y / H, i = (y * W + x) * 4;
      const inside = C.oklchToLinear({ L, C: c, h: hue }).every((v) => v >= -1e-4 && v <= 1 + 1e-4);
      img.data[i] = img.data[i + 1] = img.data[i + 2] = inside ? 236 : 255; img.data[i + 3] = 255;
      if (inside) { const [r, g, b] = C.oklchToRgb8({ L, C: c, h: hue }); img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = b; img.data[i + 3] = 70; }
    }
    ctx.putImageData(img, 0, 0);
    const X = (c) => (c / Cmax) * W, Y = (L) => (1 - L) * H;
    for (const [k, col] of [['grounded', '#7a7a7a'], ['ripe', '#111111']]) {
      const b = T.bounds(k, hue);
      ctx.fillStyle = col + '33'; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.fillRect(X(b.Cmin), Y(b.Lmax), X(b.Cmax) - X(b.Cmin), Y(b.Lmin) - Y(b.Lmax));
      ctx.strokeRect(X(b.Cmin), Y(b.Lmax), X(b.Cmax) - X(b.Cmin), Y(b.Lmin) - Y(b.Lmax));
      ctx.fillStyle = col; ctx.font = '11px system-ui'; ctx.fillText(TERRITORIES[k].label, X(b.Cmin) + 4, Y(b.Lmax) + 13);
    }
    for (const e of cur.items) { ctx.beginPath(); ctx.arc(X(e.c.C), Y(e.c.L), 6, 0, 7); ctx.fillStyle = e.hex; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = '#444'; ctx.font = '11px system-ui';
    ctx.fillText(`x: chroma 0–${Cmax}  ·  y: lightness`, 6, H - 6);
  }

  /* ---------- exports ---------- */
  function exportData() {
    const extras = cur.chipItems.map((e) => [e.label, e.hex]);
    return {
      balance: +S.p.toFixed(3), layout: cur.code, chips: cur.q.chips, recommended: cur.q.recommended,
      colors: cur.ranked.map((o) => {
        const g = E.guidance(o.hex, o.c);
        return { name: o.label, territory: o.key, role: o.role, anchor: o.anchor, hex: o.hex, rgb: o.spec.rgb, cmykApprox: o.spec.cmyk, oklch: o.spec.oklchText,
          guidance: g.tags.map((t) => t.text),
          approvedForeground: E.foregrounds(o.hex, extras).filter((f) => f.level !== 'fail').map((f) => ({ fg: f.name, hex: f.fg, use: LEVEL[f.level][0] })) };
      }),
    };
  }
  function exportCss() {
    const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const d = exportData();
    return ':root {\n' + d.colors.map((c) => `  --sg-${slug(c.name)}: ${c.hex}; /* ${c.territory}, ${c.role}${c.anchor ? ', anchor' : ''}; ${c.oklch} */`).join('\n') + `\n  --sg-ink: ${CONFIG.inkHex};\n}\n`;
  }

  function copy(text, label = 'Copied') {
    const done = () => toast(label);
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed'); } ta.remove();
  }
  let toastTimer;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1700); }

  /* ---------- render orchestration ---------- */
  let raf = 0;
  function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; fullRender(); }); }
  function fullRender() {
    snapshot();
    renderExpression(); renderExplore(); renderCounterparts(); renderStage(); renderApply(); renderSheet(); writeHash();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b) return;
    const a = b.dataset.action, v = b.dataset.v || b.dataset.id;
    if (a === 'layout') { S.picks[cur.z.id] = +v; fullRender(); }
    else if (a === 'chip') { if (v === 'e') { toast('Evergreen is the constant.'); return; } S.active = v; fullRender(); }
    else if (a === 'sheet') { S.sheet = S.sheet === v ? null : v; renderSheet(); }
    else if (a === 'close-sheet') { S.sheet = null; renderSheet(); }
    else if (a === 'cp-toggle') { S.cpOpen = !S.cpOpen; renderCounterparts(); }
    else if (a === 'mix') { S.p = 0.5; fullRender(); }
    else if (a === 'rec') { setChip(b.dataset.target, S.recs[+v].color); fullRender(); }
    else if (a === 'copy') copy(v);
    else if (a === 'copy-css') copy(exportCss(), 'CSS variables copied');
    else if (a === 'copy-json') copy(JSON.stringify(exportData(), null, 2), 'JSON copied');
    else if (a === 'copy-link') { writeHash(); copy(location.href, 'Link copied'); }
    else if (a === 'lib-add') addToLibrary();
    else if (a === 'lib-open') { const it = loadLib().find((x) => x.id === v); if (it) { applyState({ p: it.p, picks: it.picks, hex: it.hex }); S.sheet = null; fullRender(); toast('Opened from library'); } }
    else if (a === 'lib-del') { saveLib(loadLib().filter((x) => x.id !== v)); renderSheet(); }
    else if (a === 'test-hex') testHex();
    else if (a === 'snap') { setChip(S.active, S.pendingSnap); $('#test-msg').textContent = 'Applied the nearest approved color.'; fullRender(); }
    else if (a === 'goto') { S.active = v; setChip(v, C.fromHex(b.dataset.hex)); $('#test-msg').textContent = ''; fullRender(); }
  });

  $('#balance').addEventListener('input', (e) => { S.p = e.target.value / 1000; schedule(); });

  const field = $('#field');
  let dragging = false;
  field.addEventListener('pointerdown', (e) => { dragging = true; field.setPointerCapture(e.pointerId); pickFromPointer(e); });
  field.addEventListener('pointermove', (e) => { if (dragging) pickFromPointer(e); });
  field.addEventListener('pointerup', () => { dragging = false; });
  field.addEventListener('keydown', (e) => {
    const key = activeKey(), c = S.chips[S.active], step = e.shiftKey ? 10 : 2;
    const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, 0.01], ArrowDown: [0, -0.01] };
    if (!moves[e.key]) return;
    e.preventDefault();
    S.chips[S.active] = T.colorAt(key, (c.h + moves[e.key][0] + 360) % 360, c.L + moves[e.key][1], S.t[S.active]);
    schedule();
  });
  $('#intensity').addEventListener('input', (e) => {
    const key = activeKey(), c = S.chips[S.active];
    S.t[S.active] = e.target.value / 100; S.chips[S.active] = T.colorAt(key, c.h, c.L, S.t[S.active]); schedule();
  });
  $('#hex-test').addEventListener('keydown', (e) => { if (e.key === 'Enter') testHex(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; renderSheet(); } });

  /* ---------- init ---------- */
  readHash();
  fullRender();
  window.SGApp = { state: S, snapshot: () => cur, exportData, loadLib };
})();

</script>
</body>
</html>
