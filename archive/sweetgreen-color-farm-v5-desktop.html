:root {
  --ev: #00A810;
  --ink: #000;
  --panel: #eee;
  --gray-1: #c1c1c1;   /* inactive step, slider handle */
  --gray-2: #888;      /* Back button */
  --gray-3: #767676;   /* secondary text */
  --pill: #f0f0f0;
  --red: #fe4848;
  --good: #00ac00;
  --font: "GT America", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --font-cn: "GT America Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --track: -0.03em;
  --ease: cubic-bezier(.22,.8,.24,1); --ease-io: cubic-bezier(.65,0,.35,1); --ease-edges: cubic-bezier(.45,0,.1,1);
  /* Color block size. Start from the base size (height = window minus 2 x margin, at most --stage-max-h; width = 32.36vw, at most
     --stage-max-w), multiply it by a factor that grows with the window width (--stage-scale at 1440px and below, up to
     --stage-scale-large from 1920px, linear in between), then never let the blocks be taller than the sidebar (window height - 50px). */
  --stage-max-h: 760px; --stage-max-w: 560px; --stage-margin-y: 50px;
  --stage-scale: 1.07; --stage-scale-large: 1.3; --stage-scale-from: 1440; --stage-scale-to: 1920;
  --t-pill: 380ms; --t-title: 350ms;
  --t-panel: 650ms; --t-block: 500ms; --t-skew: 420ms; --t-fade: 220ms; --t-edges: 1200ms; --t-collapse: 450ms; --t-blocks: 500ms;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* letter-spacing in em is turned into pixels where it is declared and then INHERITED as pixels, so setting it once on body gave every size the same -0.48px. Declaring it on every element makes it proportional (-3% of each element's own size). */
* { letter-spacing: var(--track); }
html, body { height: 100%; background: #fff; overflow: hidden; }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
button { cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ev); outline-offset: 2px; }

#frame { position: fixed; inset: 0; background: #fff; }
/* Fluid layout: margin 25px, gutter 20px. --pl is the left edge of the panel area (used to center the stage and place g). */
#art { position: absolute; inset: 0; overflow: hidden; --pl: calc(100vw - 4px); --sw: min(32.36vw, 560px); /* fallback; the real width is set from script (see sizeStage) */ }
#art[data-view="main"] { --pl: calc(100vw - 357px); }
#art[data-view="about"] { --pl: calc(100vw - 709px); }
#art[data-view="library"] { --pl: calc(100vw - 592px); }

/* ---------- s and g ---------- */
.mk { position: absolute; top: calc(50% - 11px); display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.mk-s { left: 25px; width: 20.28px; height: 22.08px; transition: left var(--t-panel) var(--ease); }
.mk-g { left: calc(var(--pl) - 42px); width: 22.28px; height: 28.51px; transition: left var(--t-panel) var(--ease); }
#art.i-mono .mk-s { left: calc(50vw - 23px); } #art.i-mono .mk-g { left: calc(50vw + 0.5px); }
#art[data-view="intro"] .mk-s, #art[data-view="intro"] .mk-g { transition-duration: var(--t-edges); transition-timing-function: var(--ease-edges); }
#art.i-mono.i-edges .mk-s { left: 25px; } #art.i-mono.i-edges .mk-g { left: calc(var(--pl) - 42px); }

/* ---------- stage (height and top are set from script: viewport height minus 100px, at most 760px) ---------- */
#stage { position: absolute; width: var(--sw); left: calc(var(--pl) / 2 + 1.5px); margin-left: calc(var(--sw) / -2); transition: left var(--t-panel) var(--ease), opacity var(--t-blocks) var(--ease), transform var(--t-blocks) var(--ease); }
#art[data-view="intro"] #stage { opacity: 0; transform: scale(.97); pointer-events: none; }
#art.i-blocks #stage { opacity: 1; transform: none; }
/* Color blocks. Technique read from the símon.com source: each block sits in a wrapper with its own CSS perspective
   (30vh, origin 50% 50%); the face inside rotates with rotateY/rotateX, the pivot (transform-origin) eases to the pointer,
   an "active" block gets a soft drop shadow, and pressing squeezes the wrapper to .95. */
.blk { position: absolute; left: 0; width: 100%; perspective: 30vh; perspective-origin: 50% 50%;
  transition: top var(--t-block) var(--ease), height var(--t-block) var(--ease), opacity var(--t-block) var(--ease), transform .3s; }
.blk .face { position: absolute; inset: 0; border-radius: var(--blk-r, 46.773px); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  font-family: var(--font-cn); font-weight: 700; font-size: 30px; line-height: .88; text-transform: uppercase; white-space: nowrap; letter-spacing: -0.02em;
  transform-origin: 50% 50%; will-change: transform; transition: background-color var(--t-fade) linear, color var(--t-fade) linear, box-shadow .5s, transform-origin .3s; }
.blk.gone { opacity: 0; pointer-events: none; }
.blk[data-id="e"] { cursor: default; }
.blk:not([data-id="e"]):active { transform: scale(.95); transition-duration: var(--t-block), var(--t-block), var(--t-block), .1s; }
.blk.hot .face { box-shadow: 0 .5rem 2rem -.15rem rgb(0 0 0 / 25%); }
.blk.hot:active .face { box-shadow: 0 .25rem 1rem -.2rem rgba(0,0,0,.1); }
.blk { z-index: 1; } .blk[data-id="e"] { z-index: 0; } /* Ripe and Grounded always sit in front of Evergreen */
.blk.hot, .blk.sel { z-index: 3; }
.blk .lab { display: block; padding: 0 20px; }
/* not chosen yet: panel gray with inactive-step gray type */
.blk.blank .face { background: #eee; color: #c1c1c1; }

/* ---------- panels: full height between the 25px margins ---------- */
.panel { position: absolute; top: 25px; bottom: 25px; width: 332px; right: -380px; background: var(--panel); border-radius: 23px; transition: right var(--t-panel) var(--ease); z-index: 3; }
#art[data-view="main"] #p-main { right: 25px; }
#art[data-view="about"] #p-main { right: 377px; }
#art[data-view="about"] #p-about { right: 25px; }
#p-lib { width: 567px; right: -620px; }
#art[data-view="library"] #p-lib { right: 25px; }

/* ---------- layout: flex + gap, mirroring the Figma auto layout ----------
   panel (padding 20) > .in: column, space-between > [ .body (stepper, step) , .bottom (extras, buttons) ].
   .stack is a column with a gap; the gap comes from the .gapN class (value in px = N). */
.panel .in { position: absolute; inset: 20px; display: flex; flex-direction: column; justify-content: space-between; }
.panel .body { min-height: 0; flex: 1 1 auto; display: flex; flex-direction: column; gap: 27px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.panel .body::-webkit-scrollbar { display: none; }
.bottom { flex: none; display: flex; flex-direction: column; }
.share { padding-bottom: 30px; }
.foot { flex: none; display: flex; gap: 4px; width: 100%; }
.stack { display: flex; flex-direction: column; gap: var(--g, 0); }
.stack.center { align-items: center; }
.stack > .stack, .stack > .fieldbox, .stack > .track, .stack > .axis, .stack > .inp { align-self: stretch; }
.gap5 { --g: 5px; } .gap7 { --g: 7px; } .gap8 { --g: 8px; } .gap9 { --g: 9px; } .gap12 { --g: 12px; } .gap13 { --g: 13px; }
.gap15 { --g: 15px; } .gap17 { --g: 17px; } .gap18 { --g: 18px; } .gap20 { --g: 20px; } .gap25 { --g: 25px; } .gap35 { --g: 35px; }
.btn { height: 38px; border-radius: 13px; font-size: 18px; line-height: 38px; text-align: center; color: #fff; padding: 0; transition: opacity var(--t-fade) linear, background-color var(--t-fade) linear; }
.btn-black { background: #000; } .btn-gray { background: var(--gray-2); }
.btn.w123 { width: 123px; } .btn.w250 { width: 250px; } .btn.grow { flex: 1; } .btn.q { width: 38px; display: grid; place-items: center; } .btn.q svg { width: 10px; height: 16px; display: block; }
.btn:hover { opacity: .88; }

/* stepper: 4 circles (28) and 3 lines (54), padding 0 9 */
.stepper { list-style: none; flex: none; display: flex; align-items: center; justify-content: center; padding: 0 9px; }
.stepper button { width: 28px; height: 28px; border-radius: 50%; background: var(--gray-1); color: #fff; font-family: var(--font-cn); font-weight: 700; font-size: 14px; line-height: 28px; text-align: center; letter-spacing: 0; transition: background-color var(--t-fade) linear; padding: 0; display: block; }
.stepper .on button { background: #000; }
.stepper hr { width: 54px; flex: none; height: 1px; border: 0; background: var(--gray-1); transition: background-color var(--t-fade) linear; }
.stepper hr.on { background: #000; }

/* a step: .sw is the column that holds it (gap between heading and content differs per step in the design) */
#step-body { flex: none; width: 100%; }
.sw { width: 100%; display: flex; flex-direction: column; align-items: center; animation: swap var(--t-fade) linear; }
.sw.s1 { gap: 35px; } .sw.s2 { gap: 30px; } .sw.s3 { gap: 25px; }
.sw > .stack { width: 100%; }
@keyframes swap { from { opacity: 0; } to { opacity: 1; } }

.hd { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.hd h2 { font-weight: 400; font-size: 20px; line-height: .9; }
.hd p { font-size: 14px; color: var(--gray-3); line-height: 1.11; }
.s3 .hd p, .s4 .hd .lt { color: var(--gray-3); font-size: 14px; line-height: 1.11; }

/* step 1 */
.axis { display: flex; align-items: center; justify-content: space-between; color: var(--gray-3); font-size: 14px; line-height: 1.11; }
.axis i { flex: none; width: 177px; height: 8px; position: relative; }
.axis i::before { content: ""; position: absolute; left: 1px; right: 1px; top: 3.5px; height: 1px; background: #9a9a9a; }
.axis i::after, .axis i b { content: ""; position: absolute; top: 1.5px; width: 5px; height: 5px; border: solid #9a9a9a; border-width: 0 0 1px 1px; transform: rotate(45deg); left: 2px; }
.axis i b { left: auto; right: 2px; border-width: 1px 1px 0 0; }
.track { position: relative; background: #fff; border-radius: 12px; touch-action: none; cursor: pointer; }
.track .knob { position: absolute; border-radius: 50%; background: var(--gray-1); top: 50%; transform: translateY(-50%); }
.track.big { height: 23px; } .track.big .knob { width: 19px; height: 19px; }
.track.small { height: 15px; border-radius: 8px; } .track.small .knob { width: 13px; height: 13px; }
.opts { position: relative; display: flex; flex-direction: column; }
.pill { position: absolute; left: 0; top: 0; width: 0; height: 0; background: #fff; border-radius: 13px; z-index: 0; pointer-events: none; transition: left var(--t-pill) var(--ease), top var(--t-pill) var(--ease), width var(--t-pill) var(--ease), height var(--t-pill) var(--ease), opacity var(--t-fade) linear; }
.pill.still { transition: none; }
.opt { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 5px; width: 100%; text-align: left; padding: 10px 10px 12px; border: 1px solid transparent; border-radius: 13px; }
.opt small { font-size: 12px; line-height: 1.0; color: var(--gray-3); }
.opt .dots { display: flex; gap: 2px; height: 11px; }
.opt .dots i { width: 11px; height: 11px; border-radius: 50%; display: block; }
.opt b { font-weight: 400; font-size: 18px; line-height: .9; white-space: nowrap; }
.opt .nr { color: var(--red); font-size: 12px; line-height: .88; margin-top: 4px; }

/* step 2 */
.tabs { position: relative; display: flex; justify-content: center; align-items: flex-start; }
.tab { position: relative; z-index: 1; display: flex; align-items: center; gap: 4.5px; padding: 3px 9px 5px; border: 1px solid transparent; border-radius: 13px; font-size: 14px; line-height: 1.11; white-space: nowrap; }
.tab i { width: 11px; height: 11px; border-radius: 50%; display: block; flex: none; }
.fieldbox { position: relative; height: 157px; border-radius: 15px; background: #e3e3e3; overflow: hidden; touch-action: none; cursor: crosshair; }
.fieldbox canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mkr { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; border: 1.5px solid #fff; pointer-events: none; box-shadow: 0 0 0 .5px rgba(0,0,0,.18); transition: left 90ms linear, top 90ms linear; }
.mkr.ev em { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); background: rgba(255,255,255,.8); border-radius: 13px; font: normal 10px/.88 var(--font); letter-spacing: var(--track); padding: 3px 4px 4px; text-transform: uppercase; color: #000; white-space: nowrap; }
.inp { position: relative; height: 31px; }
.inp input { width: 100%; height: 31px; border-radius: 30px; background: #fff; padding: 0 72px 0 11px; font-size: 14px; }
.inp input::placeholder { color: #adadad; opacity: 1; }
.inp .go { position: absolute; right: 0; top: 0; width: 60px; height: 31px; border-radius: 30px; background: #000; color: #fff; font-size: 14px; }
.res { display: flex; flex-direction: column; gap: 2px; align-self: flex-start; width: 269px; font-size: 14px; line-height: 1.11; }
.res .t { color: #888; }
.tone-good { color: #25ac00; } .tone-info { color: #2f7de1; } .tone-warn { color: var(--red); }
.res .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.lnk { text-decoration: underline; text-underline-offset: 2px; font-size: 14px; line-height: 1.11; text-align: left; }
.sw-chip { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 3px; }

/* step 3 */
.grid3 { display: grid; grid-template-columns: repeat(3, 84.43px); gap: 9.38px; justify-content: center; }
.rec { width: 84.43px; height: 85.37px; border-radius: 13px; position: relative; display: block; box-shadow: inset 0 0 0 0 #fff; transition: box-shadow var(--t-fade) linear, transform var(--t-fade) var(--ease); }
.rec::after { content: ""; position: absolute; left: 50%; top: 50%; width: 29px; height: 29px; margin: -14.5px; border-radius: 50%; background: var(--ev); }
.rec:hover { transform: scale(1.03); } .rec.on { box-shadow: inset 0 0 0 3px #fff; }
#reset { display: flex; justify-content: center; }
.small-link { font-size: 14px; line-height: .88; text-decoration: underline; text-underline-offset: 2px; }
.invite { font-size: 14px; line-height: 1.11; text-align: center; max-width: 273px; }

/* step 4 */
.apply-body { width: 281px; }
.rows4 { width: 100%; align-items: flex-start; }
.crow { display: flex; align-items: center; gap: 10px; }
.crow .sw { width: 51px; height: 51px; border-radius: 7px; flex: none; }
.crow .nm { display: flex; align-items: flex-end; gap: 7px; font-size: 14px; line-height: .88; white-space: nowrap; }
.crow .nm span { color: var(--gray-3); font-size: 12px; }
.crow .vals { display: inline-grid; grid-template-columns: repeat(2, fit-content(100%)); gap: 2px 7px; }
.val { display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: .88; color: var(--gray-3); text-align: left; white-space: nowrap; }
.val.cm > span { width: 40px; }
.val code { font: 11px/1.05 var(--font); letter-spacing: var(--track); color: #6f6f6f; background: var(--pill); border: .536px solid #b2b2b2; border-radius: 3.213px; padding: 2px 3px; }
.mxwrap { width: 285px; }
.mx { display: grid; gap: 5px; width: 100%; }
.mx .h { display: flex; justify-content: center; align-items: center; height: 11px; margin-bottom: 2px; }
.mx .h i { width: 11px; height: 11px; border-radius: 50%; display: block; box-shadow: 0 0 0 .5px rgba(0,0,0,.2); }
.mx .c { height: 39px; border-radius: 3px; position: relative; display: grid; place-items: center; font-family: var(--font-cn); font-weight: 700; font-size: 14px; line-height: .88; letter-spacing: 0; }
.mx .c.same { background: repeating-linear-gradient(45deg, #e4e4e8 0 4px, #f6f6f8 4px 8px); }
.mx .c.lvl-fail .a { opacity: .4; text-decoration: line-through; }
.mx .c .m { position: absolute; right: 4px; bottom: 4px; font: 400 10.5px/.88 var(--font); letter-spacing: var(--track); display: flex; }
.mx .c .m svg { display: block; width: 8px; height: 8px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; width: 251px; font-size: 12px; line-height: .88; color: var(--gray-3); }
.legend span { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.legend b { font-weight: 400; color: #000; } .legend svg { width: 9px; height: 9px; color: #000; }
.lt.left { font-size: 12px; line-height: 1.11; }
.share p { font-size: 14px; line-height: 1.11; } .share .row { display: flex; gap: 9px; }
.pname, .pname input { height: 28px; } .pname input { border-radius: 14px; transform: translate(-2px, 0px); }

/* about */
.about { flex: 1 1 auto; min-height: 0; font-size: 17.5px; line-height: 16px; overflow: hidden; letter-spacing: -0.045em; }
.about p { line-height: 16px; } .about p + p { margin-top: 16px; text-indent: 18px; }

/* library: padding 40 40 20, grid 4 columns (gap 36 x 30), Close under it */
#p-lib .in { inset: 0; padding: 40px 40px 20px; gap: 15px; }
.lib { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px 36px; align-content: start; border-radius: 13.5px; }
.lib::-webkit-scrollbar { display: none; }
.lib .it { min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 14.63px; font-size: 13px; line-height: .88; text-align: center; }
.lib .th { position: relative; width: 100%; aspect-ratio: 94.856 / 94.284; border-radius: 13.5px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.lib .th i { display: block; }
.lib .nm { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib .hov { position: absolute; left: 50%; top: 50%; width: 46px; height: 22px; margin: -11px 0 0 -23px; border-radius: 5px; background: #000; display: none; place-items: center; grid-template-columns: 1fr 1fr; }
.lib .hov button { width: 23px; height: 22px; display: grid; place-items: center; } .lib .hov svg { width: 12px; height: 12px; }
.lib .it:hover .hov, .lib .it:focus-within .hov { display: grid; }
.lib .empty { grid-column: 1 / -1; font-size: 14px; line-height: 1.11; color: var(--gray-3); }

.toast { position: absolute; left: 50%; bottom: 8px; transform: translate(-50%, 20px); background: #000; color: #fff; font-size: 12px; line-height: 12px; padding: 9px 14px; border-radius: 13px; opacity: 0; pointer-events: none; transition: opacity .2s linear, transform .2s var(--ease); z-index: 9; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- intro ---------- */
#intro { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
#intro img { position: absolute; display: block; opacity: 0; transform: scale(.96); object-fit: cover; transition: opacity 120ms linear, transform 260ms var(--ease); }
#intro img.on { opacity: 1; transform: none; }
/* the photos stay fully opaque; a white panel fades in over them (a dissolve to white, not a see-through overlap) */
.icover { position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; margin: -210px 0 0 -210px; background: #fff; opacity: 0; transition: opacity var(--t-collapse) var(--ease-io); }
#art.i-collapse .icover { opacity: 1; }
#art.i-blocks #intro { display: none; } /* the intro layer (and its white panel) must not sit over the color blocks */
#art[data-view="intro"] .panel { transition: none; }

@media (prefers-reduced-motion: reduce) { :root { --t-panel: 1ms; --t-block: 1ms; --t-skew: 1ms; --t-fade: 1ms; } }


/* intro title */
.ititle { position: absolute; left: 0; right: 0; top: 50%; margin-top: -13px; text-align: center; font-family: var(--font-cn); font-weight: 700; font-size: 30px; line-height: 26px; letter-spacing: -0.02em; text-transform: uppercase; opacity: 0; transition: opacity var(--t-title) linear; }
#art.i-title .ititle { opacity: 1; }


</style>
</head>

/* Color math: OKLCH <-> sRGB, gamut fitting, distance, contrast (WCAG + APCA).
   Pure functions, no DOM. Attaches to the global SG namespace (works in browser and Node). */
(function (root) {
  const SG = (root.SG = root.SG || {});
  const RAD = Math.PI / 180;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ramp = (x, a, b) => clamp((x - a) / (b - a), 0, 1);
  const hueDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

  const toLinear = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
  const fromLinear = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);

  function oklchToLinear({ L, C, h }) {
    const a = C * Math.cos(h * RAD), b = C * Math.sin(h * RAD);
    const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    const s = Math.pow(L - 0.0894841775 * a - 1.291485548 * b, 3);
    return [
      4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
    ];
  }

  function linearToOklch([r, g, b]) {
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    const L = 0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s;
    const a = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s;
    const bb = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
    const C = Math.hypot(a, bb);
    let h = Math.atan2(bb, a) / RAD;
    if (h < 0) h += 360;
    return { L, C, h: C < 1e-4 ? 0 : h };
  }

  const inGamut = (lin, eps = 1e-4) => lin.every((v) => v >= -eps && v <= 1 + eps);

  /** Reduce chroma (hue and lightness fixed) until the color fits inside sRGB. */
  function fitToGamut(c) {
    if (inGamut(oklchToLinear(c))) return { L: c.L, C: c.C, h: c.h };
    let lo = 0, hi = c.C;
    for (let i = 0; i < 22; i++) {
      const mid = (lo + hi) / 2;
      if (inGamut(oklchToLinear({ L: c.L, C: mid, h: c.h }))) lo = mid; else hi = mid;
    }
    return { L: c.L, C: lo, h: c.h };
  }

  function oklchToRgb8(c) {
    const f = fitToGamut(c);
    return oklchToLinear(f).map((v) => Math.round(clamp(fromLinear(clamp(v, 0, 1)), 0, 1) * 255));
  }

  const hex2 = (n) => n.toString(16).padStart(2, '0');
  const toHex = (c) => '#' + oklchToRgb8(c).map(hex2).join('').toUpperCase();

  function parseHex(hex) {
    const m = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.exec(String(hex).trim());
    if (!m) return null;
    let s = m[1];
    if (s.length === 3) s = s.split('').map((x) => x + x).join('');
    return [0, 2, 4].map((i) => parseInt(s.slice(i, i + 2), 16));
  }
  function fromHex(hex) {
    const rgb = parseHex(hex);
    return rgb ? linearToOklch(rgb.map((v) => toLinear(v / 255))) : null;
  }

  function deltaE(a, b) {
    const ax = a.C * Math.cos(a.h * RAD), ay = a.C * Math.sin(a.h * RAD);
    const bx = b.C * Math.cos(b.h * RAD), by = b.C * Math.sin(b.h * RAD);
    return Math.hypot(a.L - b.L, ax - bx, ay - by);
  }

  function wcag(fgHex, bgHex) {
    const Y = (hex) => { const [r, g, b] = parseHex(hex).map((v) => toLinear(v / 255)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
    const [hi, lo] = [Y(fgHex), Y(bgHex)].sort((x, y) => y - x);
    return (hi + 0.05) / (lo + 0.05);
  }

  /** APCA-W3 0.98G-4g. Returns signed Lc (positive = dark text on light bg). */
  function apca(fgHex, bgHex) {
    const Y = (hex) => {
      const [r, g, b] = parseHex(hex).map((v) => Math.pow(v / 255, 2.4));
      const y = 0.2126729 * r + 0.7151522 * g + 0.072175 * b;
      return y >= 0.022 ? y : y + Math.pow(0.022 - y, 1.414);
    };
    const yt = Y(fgHex), yb = Y(bgHex);
    if (Math.abs(yb - yt) < 0.0005) return 0;
    const s = yb > yt ? (Math.pow(yb, 0.56) - Math.pow(yt, 0.57)) * 1.14 : (Math.pow(yb, 0.65) - Math.pow(yt, 0.62)) * 1.14;
    if (Math.abs(s) < 0.1) return 0;
    return (s > 0 ? s - 0.027 : s + 0.027) * 100;
  }

  /** Naive device-independent CMYK. Indicative only; real print values need a press profile. */
  function cmyk(hex) {
    const [r, g, b] = parseHex(hex).map((v) => v / 255);
    const k = 1 - Math.max(r, g, b);
    if (k >= 1) return [0, 0, 0, 100];
    return [(1 - r - k) / (1 - k), (1 - g - k) / (1 - k), (1 - b - k) / (1 - k), k].map((v) => Math.round(v * 100));
  }

  const oklchString = (c) => `oklch(${(c.L * 100).toFixed(1)}% ${c.C.toFixed(3)} ${c.h.toFixed(1)})`;

  SG.color = { clamp, lerp, ramp, hueDiff, oklchToLinear, linearToOklch, fitToGamut, oklchToRgb8, toHex, parseHex, fromHex, deltaE, wcag, apca, cmyk, oklchString };
  if (typeof module !== 'undefined') module.exports = SG.color;
})(typeof globalThis !== 'undefined' ? globalThis : this);

<script>
/* Territory definitions: Grounded and Ripe as irregular, hue-dependent regions of OKLCH space.
   Each territory is a table of keypoints every 30 degrees of hue: [hue, Lmin, Lmax, Cmin, Cmax].
   Bounds between keypoints are interpolated, so the region is NOT one rectangle.

   PROVISIONAL: these values are a seed, set from general color knowledge, not from Sweetgreen's
   approved samples. Methodology: Visual -> Sample -> Measure -> Rule. Replace the tables with
   values measured from the approved/borderline/outside sample set (see README). */
(function (root) {
  const SG = root.SG;
  const { clamp, lerp, hueDiff, fitToGamut, fromHex } = SG.color;

  const CONFIG = {
    evergreenHex: '#00A810', // PANTONE 2423 C, RGB 0/168/16. Single source for the brand anchor
    inkHex: '#111111',        // dark type color used in contrast tests (assumed; confirm)
    whiteHex: '#FFFFFF',
    coreDepth: 0.15,          // inside by >= 15% of the local range = "core"; 0..15% = "edge"
  };

  //                 hue   Lmin  Lmax  Cmin  Cmax
  const GROUNDED = [
    [0,   0.38, 0.62, 0.060, 0.130],
    [30,  0.38, 0.64, 0.065, 0.135],
    [60,  0.45, 0.72, 0.065, 0.115],
    [90,  0.55, 0.80, 0.065, 0.110],
    [120, 0.45, 0.76, 0.055, 0.120],
    [150, 0.38, 0.72, 0.050, 0.105],
    [180, 0.38, 0.70, 0.040, 0.085],

    [240, 0.36, 0.70, 0.040, 0.095],
    [270, 0.36, 0.66, 0.045, 0.105],
    [300, 0.36, 0.64, 0.050, 0.105],
    [330, 0.37, 0.63, 0.055, 0.115],

  const RIPE = [
    [0,   0.56, 0.72, 0.170, 0.250],
    [30,  0.62, 0.73, 0.160, 0.225],

    [90,  0.82, 0.91, 0.110, 0.160],
    [120, 0.70, 0.88, 0.150, 0.210],
    [150, 0.68, 0.86, 0.150, 0.220],
    [180, 0.66, 0.84, 0.100, 0.135],

    [240, 0.55, 0.72, 0.120, 0.160],
    [270, 0.46, 0.64, 0.160, 0.260],
    [300, 0.50, 0.70, 0.150, 0.280],
    [330, 0.56, 0.76, 0.190, 0.270],
  ];

  const TERRITORIES = {
    grounded: {
      key: 'grounded', label: 'Grounded', table: GROUNDED,
      character: ['Rooted', 'Substantial', 'Calm', 'Tempered', 'Elemental'],
      slider: ['Tempered', 'Fuller'],
      blurb: 'Earth, terrain, minerals, water, atmosphere. Tempered, not muted.',
    },
    ripe: {
      key: 'ripe', label: 'Ripe', table: RIPE,
      character: ['Vibrant', 'Expressive', 'Juicy', 'Abundant', 'Full'],
      slider: ['Bright', 'Heightened'],
      blurb: 'Fruit, flowers, crops, blooms. Heightened, not just saturated.',

  /** Interpolated {Lmin, Lmax, Cmin, Cmax} of a territory at hue h. */
  function bounds(key, h) {
    const t = TERRITORIES[key].table;
    const hh = ((h % 360) + 360) % 360;
    const i = Math.floor(hh / 30) % 12, f = (hh % 30) / 30;
    const a = t[i], b = t[(i + 1) % 12];
    return { Lmin: lerp(a[1], b[1], f), Lmax: lerp(a[2], b[2], f), Cmin: lerp(a[3], b[3], f), Cmax: lerp(a[4], b[4], f) };
  }

  /** Signed normalised depth: >0 inside (0.5 = dead center), <0 outside. */
  function depthIn(key, c) {

<script>
/* Spectrum rules: which color-chip combinations are allowed at each point of the
   Grounded <-> Ripe balance, and how much visual area each chip gets.

   Notation: G = Grounded chip, E = Evergreen (always present, never counted), R = Ripe chip.
   At most 3 chips excluding Evergreen. Two Grounded or two Ripe (and so any 3-chip layout) are possible but not recommended.

   The balance value p is the Ripe weight: 0 = Grounded end, 1 = Ripe end (slider runs G -> R).
   Zones are listed from the Grounded end to the Ripe end. In each zone the default layout is
   the first recommended one; "lead" says which territory is visually larger there. */

  const SG = root.SG;

  const MAX_CHIPS = 3;
  const RECOMMENDED_MAX = 2;

  const ZONES = [
    { id: 'z1', min: 0.0, lead: 'grounded', name: 'Grounded end', combos: ['GGE', 'GE'] },
    { id: 'z2', min: 0.2, lead: 'grounded', name: 'Grounded to center', combos: ['GGER', 'GER'] },
    { id: 'z3', min: 0.4, lead: null, name: 'Center', combos: ['GER'] },
    { id: 'z4', min: 0.6, lead: 'ripe', name: 'Center to Ripe', combos: ['GERR', 'GER'] },
    { id: 'z5', min: 0.8, lead: 'ripe', name: 'Ripe end', combos: ['ERR', 'ER'] },

    return idx;

  function defaultPick(zone) {

  /** Chip ids present in a combo, e.g. 'GGER' -> ['g1','g2','r1']. */

  const areaOf = (w) => 0.25 + 0.95 * w;

  function weights(p) {
    const w = ZONES[zoneIndex(p)].lead === null ? 0.5 : p;

<script>
/* Back-end color logic. Evaluates a color (or a combination) along several dimensions at once:
   territory membership, Evergreen relationship, cross-territory compatibility, visual hierarchy,
   and contrast. Everything returns plain data; app.js translates it into brand language.
   All thresholds live in PARAMS so they can be tuned against approved samples. */

  const SG = root.SG;
  const C = SG.color, T = SG.territories;
  const { clamp, ramp, hueDiff } = C;

  const PARAMS = {
    evergreen: { // weights sum to 1
      w: { distinct: 0.30, separation: 0.20, hue: 0.15, chroma: 0.10, dominance: 0.25 },
      distinctRange: [0.08, 0.22],   // OKLab distance that reads as "its own color"
      separationRange: [0.05, 0.25], // |dL| to Evergreen

    // read well; the middle bands are the awkward "almost related" zone.

    pair: { w: { distinct: 0.35, spread: 0.20, chromaBalance: 0.20, hue: 0.25 }, distinctRange: [0.10, 0.28] },
    trio: { relG: 0.3, relR: 0.3, pair: 0.4 },

    if (parts.separation < 0.4 && parts.dominance >= 0.6) notes.push('Similar depth to Evergreen; pair with care.');
    if (dh >= 150 && parts.distinct >= 0.5) notes.push('An intentional contrast to Evergreen.');

(function () {

    ease: 'cubic-bezier(.22,.8,.24,1)',
    easeInOut: 'cubic-bezier(.65,0,.35,1)',
    panel: 650,       // panels sliding in and out, stage and "g" re-centering with them
    block: 500,       // color block resize when the balance changes
    skew: 420,        // selected color block tilting into its pose
    seqGap: 60,       // pause between one panel leaving and the next one entering
    pill: 380,        // the white highlight sliding between tabs / layout options
    tilt: { follow: 0.16, ry: 8, rx: 6, reachX: 380, reachY: 320 }, // color blocks in 3D (perspective, shadow and press are CSS: .blk, 30vh)
    fade: 220,        // small content swaps
    intro: {
      mono: 600,      // "sg" monogram shows alone
      toEdges: 1200,   // s and g travel to the screen edges
      stack: 130,     // gap between photos stacking up at the center
      hold: 450,      // pause with the full stack
      collapse: 550,  // white dissolves over the photos
      title: 350,     // "color farm" fades in and out
      titleHold: 800, // and stays this long
      blocks: 500,    // the three color blocks arrive once the photos are gone
      panelDelay: 150 // panel arrives this long after the blocks

    s.setProperty('--t-panel', M.panel + 'ms'); s.setProperty('--t-block', M.block + 'ms');
    s.setProperty('--t-skew', M.skew + 'ms'); s.setProperty('--t-fade', M.fade + 'ms');
    s.setProperty('--t-edges', M.intro.toEdges + 'ms'); s.setProperty('--t-collapse', M.intro.collapse + 'ms'); s.setProperty('--t-blocks', M.intro.blocks + 'ms'); s.setProperty('--t-pill', M.pill + 'ms'); s.setProperty('--t-title', M.intro.title + 'ms');
  };

  const IMGS = [ // file, width, height in px (from the design); every photo is centered on the screen
    ['a', 181, 201], ['b', 141, 251], ['c', 203, 225], ['d', 157, 200],
    ['e', 115, 171], ['f', 228, 171], ['g', 203, 269], ['h', 157, 220],
  ];

    host.innerHTML = IMGS.map(([f, w, h]) => `<img src="${window.__INTRO[f]}" alt="" style="left:50%;top:50%;margin:${-h / 2}px 0 0 ${-w / 2}px;width:${w}px;height:${h}px">`).join('') + '<div class="icover"></div><div class="ititle">color farm</div>';

    t += imgs.length * T.stack + T.hold;
    at(t, () => art.classList.add('i-collapse'));                       // 1. photos leave
    t += T.collapse;
    at(t, () => art.classList.add('i-title'));                          // 2. "color farm" title
    t += T.title + T.titleHold;
    at(t, () => art.classList.remove('i-title'));

      const lead = cur.z.lead ? (cur.z.lead === 'grounded' ? 'Grounded-led' : 'Ripe-led') : 'Balanced';
      return `<button class="opt${i === cur.pick ? ' on' : ''}" data-action="layout" data-v="${i}" role="radio" aria-checked="${i === cur.pick}">
        <small>${lead}</small><span class="dots">${dots}</span><b>${SP.label(code)}</b>${q.recommended ? '' : '<span class="nr">Not recommended</span>'}</button>`;
    }).join(''));
  }

  function renderStep2() {
    const key = activeKey(), terr = TERRITORIES[key];
    $('#sub').textContent = `${terr.label}: ${terr.character.slice(0, 3).join(' / ')}`;
    renderTabs();
    $('#lo').textContent = terr.slider[0]; $('#hi').textContent = terr.slider[1];
    ui.int.set(S.t[S.active]);
    drawField();

    if (!S.picked[S.active]) {
      $('#res').innerHTML = S.testMsg || `<p>No ${terr.label} color chosen yet</p><p class="t">Click the color field, move the slider or check a HEX to choose one.</p>`;
    } else {
      const ev = E.evaluate(cur.pickedChips.map((i) => ({ key: i.key, c: i.c }))), [lab, tone] = overallLabel(ev.score);
      $('#res').innerHTML = S.testMsg || `<p>This combination <span class="tone-${tone}">${lab}</span></p><p class="t">${esc(ev.notes.slice(0, 2).join(' ') || 'Evergreen anchors the combination.')}</p>`;
    }
  }

  function buildField(key, t) {
    const { w, h, Ltop, Lbot } = FIELD;
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h);
    for (let x = 0; x < w; x++) {
      const hue = (x / w) * 360, b = T.bounds(key, hue);
      for (let y = 0; y < h; y++) {
        const L = Ltop - (y / (h - 1)) * (Ltop - Lbot), i = (y * w + x) * 4;
        const dL = Math.min(L - b.Lmin, b.Lmax - L) / (b.Lmax - b.Lmin);
        let ok = dL >= 0;
        if (ok) {
          const fit = C.fitToGamut({ L, C: b.Cmin + t * (b.Cmax - b.Cmin), h: hue });
          if (fit.C < b.Cmin * 0.92) ok = false;
          else { const [r, g, bl] = C.oklchToRgb8(fit); img.data[i] = r; img.data[i + 1] = g; img.data[i + 2] = bl; img.data[i + 3] = Math.round(255 * C.clamp(dL / 0.06, 0.35, 1)); }
        }
        if (!ok) { img.data[i] = img.data[i + 1] = img.data[i + 2] = 0; img.data[i + 3] = 0; }
      }
    }
    ctx.putImageData(img, 0, 0);
    return cv;
  }
  function drawField() {
    const key = activeKey(), t = S.t[S.active], ck = key + ':' + t.toFixed(2);
    if (S.fieldKey !== ck) { S.fieldBitmap = buildField(key, t); S.fieldKey = ck; }
    const cv = $('#field'), ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(S.fieldBitmap, 0, 0);
    const c = S.chips[S.active], { Ltop, Lbot } = FIELD, m = $('#mkr'), ev = $('#ev-mkr');
    m.style.display = S.picked[S.active] ? '' : 'none'; m.style.left = (c.h / 360) * 100 + '%'; m.style.top = ((Ltop - c.L) / (Ltop - Lbot)) * 100 + '%'; m.style.background = C.toHex(c);
    ev.style.left = (T.evergreen.h / 360) * 100 + '%'; ev.style.top = ((Ltop - T.evergreen.L) / (Ltop - Lbot)) * 100 + '%'; ev.style.background = CONFIG.evergreenHex;
  }
  function pickFromPointer(e) {
    const r = $('#field').getBoundingClientRect(), { Ltop, Lbot } = FIELD;
    const h = C.clamp((e.clientX - r.left) / r.width, 0, 0.9999) * 360;
    const L = Ltop - C.clamp((e.clientY - r.top) / r.height, 0, 1) * (Ltop - Lbot);
    S.chips[S.active] = T.colorAt(activeKey(), h, L, S.t[S.active]); markPicked(S.active); S.testMsg = ''; schedule();
  }
  function setChip(id, c) { S.chips[id] = c; S.t[id] = T.intensityOf(terrOf(id), c); markPicked(id); }

  function testHex() {
    const c = C.fromHex($('#hex').value), key = activeKey(), id = S.active;
    if (!c) { S.testMsg = '<p>Enter a valid HEX, like #E4572E.</p>'; renderStep2(); return; }
    if (c.C < 0.02) c.h = S.chips[id].h;
    const m = T.membership(c), mine = terrName(key);
    if (m.territory === key) { setChip(id, c); S.testMsg = `<p>Inside ${mine}. Applied.</p>`; fullRender(); return; }
    const other = m.territory && cur.ids.some((x) => terrOf(x) === m.territory) ? m.territory : null;
    const where = m.territory ? `That color belongs to ${terrName(m.territory)}.` : 'That color sits outside the Sweetgreen territories.';
    S.pendingSnap = T.snapInto(key, c);
    S.testMsg = `<p>${where} Nearest ${mine}: <i class="sw-chip" style="background:${C.toHex(S.pendingSnap)}"></i>${C.toHex(S.pendingSnap)}</p>
      <div class="acts"><button class="lnk" data-action="snap">Use it</button>${other ? `<button class="lnk" data-action="goto" data-v="${other[0]}1" data-hex="${C.toHex(c)}">Use as ${terrName(other)}</button>` : ''}</div>`;
    renderStep2();
  }

  function renderStep3() {
    const from = activeKey(), to = from === 'grounded' ? 'ripe' : 'grounded', target = to[0] + '1';
    $('#sub').textContent = cur.hasG && cur.hasR ? `${terrName(to)} counterparts for your ${cur.byId[S.active].label}` : 'Add a counterpart to see suggestions';
    renderTabs();
    $('#reset').innerHTML = '';
    if (cur.hasG && cur.hasR && !S.picked[S.active]) {
      $('#cp').innerHTML = `<div class="stack gap8 center"><p class="invite">Choose your ${cur.byId[S.active].label} in Explore color first, then we'll suggest ${terrName(to)} counterparts that work with it and Evergreen.</p><button class="lnk" data-action="step" data-v="2">Back to Explore color</button></div>`;
    } else if (cur.hasG && cur.hasR) {
      S.recs = E.recommend(S.chips[S.active], from, 6);
      $('#cp').innerHTML = `<div class="grid3">${S.recs.map((r, i) => {
        const sp = E.spec(r.color), on = cur.byId[target] && cur.byId[target].hex === sp.hex;
        return `<button class="rec${on ? ' on' : ''}" style="background:${sp.hex}" data-action="rec" data-v="${i}" data-target="${target}" aria-label="${sp.hex}" title="${esc(r.reason)}. Replaces ${esc(cur.labelOf(target))}."></button>`;
      }).join('')}</div>`;
      $('#reset').innerHTML = '<button class="small-link" data-action="reset-sel">reset selection</button>';
    } else {
      const other = terrName(to);
      $('#cp').innerHTML = `<div class="stack gap8 center"><p class="invite">Want a ${other} counterpart? We'll suggest options that work with your color and Evergreen.</p><button class="lnk" data-action="mix">Add ${other}</button></div>`;
    }
  }

  const val = (cls, label, text, copy) => `<button class="val ${cls}" data-action="copy" data-v="${esc(copy ?? text)}" title="Copy ${label}"><span>${label}</span><code>${text}</code></button>`;
  function renderStep4() {
    const order = ['e', 'r1', 'r2', 'g1', 'g2'].filter((id) => cur.byId[id] && pickedOnly(cur.byId[id])).map((id) => ({ ...cur.byId[id], ...cur.roles[id] }));
    const left = cur.chipItems.filter((i) => !i.picked).map((i) => i.label);
    const rows = order.map((o) => {
      const s = o.spec, role = o.id === 'e' ? 'Anchor' : ROLE_LABEL[o.role] + (o.label === terrName(o.key) ? '' : ' · ' + terrName(o.key));
      return `<div class="crow"><span class="sw" style="background:${o.hex}"></span><div class="stack gap7"><div class="nm">${esc(o.label)}<span>${role}</span></div>
        <div class="vals">${val('', 'HEX', s.hex)}${val('cm', 'CMYK', s.cmyk.join('/'), `cmyk(${s.cmyk.join(', ')})`)}${val('', 'RGB', s.rgb.join(', '), `rgb(${s.rgb.join(', ')})`)}${val('', 'OKLCH', `${(s.oklch.L * 100).toFixed(1)}%/${s.oklch.C.toFixed(3)}/${s.oklch.h.toFixed(0)}`, s.oklchText)}</div></div></div>`;
    }).join('');
    const cols = [['White', CONFIG.whiteHex], ['Ink', CONFIG.inkHex], ['Evergreen', CONFIG.evergreenHex], ...cur.pickedChips.map((c) => [c.label, c.hex])];
    const head = cols.map(([n, hex]) => `<div class="h" title="${esc(n)} type"><i style="background:${hex}"></i></div>`).join('');
    const cells = order.map((o) => cols.map(([n, hex]) => {
      if (hex.toUpperCase() === o.hex.toUpperCase()) return `<div class="c same" title="Same color"></div>`;
      const r = E.contrastLevel(hex, o.hex), mark = r.level === 'body' ? ICON.check : r.level === 'large' ? 'L' : ICON.cross;
      return `<div class="c lvl-${r.level}" style="background:${o.hex};color:${hex}" title="${esc(n)} on ${esc(o.label)}: ${LEVEL[r.level][0]}"><span class="a">Aa</span><span class="m">${mark}</span></div>`;
    }).join('')).join('');
    $('#apply').innerHTML = hd('Apply', 'How to use these colors') + `
      <div class="stack gap25 center apply-body">
        <div class="stack gap15 rows4">${rows}</div>
        <div class="stack gap13 mxwrap">
          <div class="mx" style="grid-template-columns:repeat(${cols.length},1fr)">${head}${cells}</div>
          <div class="legend"><span>${ICON.check} Body text</span><span><b>L</b> Large text only</span><span>${ICON.cross} Avoid</span><span>Columns: type color</span></div>
          ${left.length ? `<p class="lt left">Not chosen yet: ${esc(left.join(', '))}. Left out of this palette.</p>` : ''}
        </div>
      </div>`;
    $('#bottom-extra').innerHTML = `<div class="stack gap20 share">
        <div class="stack gap5"><p>Share this palette</p><div class="row"><button class="lnk" data-action="copy-link">Copy link</button><button class="lnk" data-action="copy-json">JSON</button><button class="lnk" data-action="copy-css">CSS variable</button></div></div>
        <div class="stack gap5"><p>Want to archive this color palette?</p><div class="inp pname"><input id="pname" type="text" maxlength="28" placeholder="Name this palette (optional)" value="${esc(S.pname)}" spellcheck="false" autocomplete="off" aria-label="Palette name"></div><div class="row"><button class="lnk" data-action="lib-add">Add to Library</button><button class="lnk" data-action="lib-show">Open Library</button></div></div>
      </div>`;
  }

  /* ---------- about, library ---------- */
  const ABOUT = [
    'Our color system is inspired by the natural cycle of growth, from the environments that nurture it to the vibrant expressions that emerge from it. Grounded represents the foundation, Ripe represents abundance and expression, and Evergreen is the living thread that connects them. Together, they create a system that can shift in energy and character while remaining distinctly sweetgreen.',
    'Our expanded palette is not a fixed collection of secondary colors. Instead, it is built around two flexible color territories: Grounded and Ripe. Grounded colors feel rooted, substantial, tempered, and elemental. Ripe colors feel vibrant, expressive, abundant, and full. Colors can be selected from either territory or brought together depending on the energy and character of the moment.',
    'These territories give us room to evolve across seasons, ingredients, collaborations, and campaigns without losing cohesion. Every new color should feel at home within its territory and work in relationship with Evergreen.',
  ];
  function renderLibrary() {
    const list = loadLib();
    $('#lib-grid').innerHTML = list.length ? list.map((it) => `<div class="it"><div class="th">${thumbHtml(it)}<span class="hov"><button data-action="lib-del" data-v="${it.id}" aria-label="Delete">${ICON.del}</button><button data-action="lib-open" data-v="${it.id}" aria-label="Open">${ICON.open}</button></span></div><div class="nm">${esc(libName(it))}</div></div>`).join('')
      : '<p class="empty">Nothing saved yet. Use Add to Library on the Apply step to keep a palette. Saved palettes stay in this browser only.</p>';
  }
  // Panels never overlap: moving between Main and Library (or About and Library) first sends the current panel
  // fully off screen, then the next one enters. Main <-> About slide together, as in the design.
  let viewTimer = 0;
  function exitThen(fn) {
    clearTimeout(viewTimer); S.busy = true; $('#art').dataset.view = 'none';
    viewTimer = setTimeout(() => { fn(); S.busy = false; }, M.panel + M.seqGap);
  }
  function setView(v) {
    const from = S.view; if (from === v) return;
    S.view = v;
    const art = $('#art');
    if (v === 'library') renderLibrary();
    if ((from === 'main' && v === 'library') || (from === 'library' && v !== 'library') || (from === 'about' && v === 'library')) exitThen(() => { art.dataset.view = v; });
    else art.dataset.view = v;
  }

  /* ---------- exports ---------- */
  function exportData() {
    const extras = cur.pickedChips.map((e) => [e.label, e.hex]);
    return {
      name: S.pname || undefined, balance: +S.p.toFixed(3), layout: cur.code, chips: cur.q.chips, recommended: cur.q.recommended,
      colors: cur.ranked.filter(pickedOnly).map((o) => {
        const g = E.guidance(o.hex, o.c);
        return { name: o.label, territory: o.key, role: o.role, anchor: o.anchor, hex: o.hex, rgb: o.spec.rgb, cmykApprox: o.spec.cmyk, oklch: o.spec.oklchText,
          guidance: g.tags.map((t) => t.text),
          approvedForeground: E.foregrounds(o.hex, extras).filter((f) => f.level !== 'fail').map((f) => ({ fg: f.name, hex: f.fg, use: LEVEL[f.level][0] })) };
      }),
    };
  }
  function exportCss() {
    const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    const d = exportData();
    return ':root {\n' + d.colors.map((c) => `  --sg-${slug(c.name)}: ${c.hex}; /* ${c.territory}, ${c.role}${c.anchor ? ', anchor' : ''}; ${c.oklch} */`).join('\n') + `\n  --sg-ink: ${CONFIG.inkHex};\n}\n`;
  }
  function copy(text, label = 'Copied') {
    const done = () => toast(label);
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed'); } ta.remove();
  }
  let toastTimer;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1700); }

  /* ---------- orchestration ---------- */
  let raf = 0;
  function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; fullRender(); }); }
  function fullRender() {
    snapshot();
    if (shown !== S.step) { shown = S.step; buildStep(); }
    renderStepper(); renderFoot(); renderStage();
    if (S.step === 1) renderStep1(); else if (S.step === 2) renderStep2(); else if (S.step === 3) renderStep3(); else renderStep4();
    $('#art').dataset.step = S.step;
    writeHash();
  }
  function goStep(n) {
    if (n === 3 && S.step !== 3) S.cpBackup = { chips: { ...S.chips }, t: { ...S.t }, picked: { ...S.picked } };
    S.step = Math.max(1, Math.min(4, n)); S.testMsg = ''; fullRender();
  }
  function restart() {
    exitThen(() => { resetAll(); $('#art').dataset.view = 'main'; });
  }
  function resetAll() {
    S.p = 0.5; S.picks = {}; S.chips = { ...seed }; S.pname = '';
    for (const id of CHIP_IDS) S.t[id] = T.intensityOf(terrOf(id), seed[id]);
    S.active = 'r1'; for (const id of CHIP_IDS) S.picked[id] = false; goStep(1);
  }

  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]');
    if (!b || !$('#art').contains(b) || S.busy) return;
    const a = b.dataset.action, v = b.dataset.v;
    if (S.view === 'library' && ['lib-del', 'lib-open'].indexOf(a) < 0 && a !== 'close-sheet') return;
    if (a === 'next') goStep(S.step + 1);
    else if (a === 'back') goStep(S.step - 1);
    else if (a === 'step') { if (+v <= S.step) goStep(+v); }
    else if (a === 'restart') restart();
    else if (a === 'layout') { S.picks[cur.z.id] = +v; fullRender(); }
    else if (a === 'chip') { if (v === 'e') { toast('Evergreen is the constant.'); return; } if (S.step < 2) return; S.active = v; S.testMsg = ''; fullRender(); }
    else if (a === 'about') setView(S.view === 'about' ? 'main' : 'about');
    else if (a === 'close-sheet') setView('main');
    else if (a === 'mix') { S.p = 0.5; S.testMsg = ''; fullRender(); }
    else if (a === 'rec') { setChip(b.dataset.target, S.recs[+v].color); fullRender(); }
    else if (a === 'reset-sel' && S.cpBackup) { Object.assign(S.chips, S.cpBackup.chips); Object.assign(S.t, S.cpBackup.t); Object.assign(S.picked, S.cpBackup.picked); fullRender(); }
    else if (a === 'copy') copy(v);
    else if (a === 'copy-css') copy(exportCss(), 'CSS variables copied');
    else if (a === 'copy-json') copy(JSON.stringify(exportData(), null, 2), 'JSON copied');
    else if (a === 'copy-link') { writeHash(); copy(location.href, 'Link copied'); }
    else if (a === 'lib-add') addToLibrary();
    else if (a === 'lib-show') setView('library');
    else if (a === 'lib-open') { const it = loadLib().find((x) => x.id === v); if (it) { applyState({ p: it.p, picks: it.picks, hex: it.hex, name: it.name, picked: it.picked }); S.step = 4; shown = 0; setView('main'); fullRender(); toast('Opened from library'); } }
    else if (a === 'lib-del') { saveLib(loadLib().filter((x) => x.id !== v)); renderLibrary(); }
    else if (a === 'test-hex') testHex();
    else if (a === 'snap') { setChip(S.active, S.pendingSnap); S.testMsg = '<p>Applied the nearest approved color.</p>'; fullRender(); }
    else if (a === 'goto') { S.active = v; setChip(v, C.fromHex(b.dataset.hex)); S.testMsg = ''; fullRender(); }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'pname') { S.pname = e.target.value.trim().slice(0, 28); writeHash(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !S.busy && S.view !== 'main' && S.view !== 'intro') setView('main'); });

  addEventListener('resize', () => { if (cur) renderStage(); });

  /* ---------- init ---------- */
  M.apply(document.documentElement);
  $('#about-text').innerHTML = ABOUT.map((t) => `<p>${t}</p>`).join('');
  buildStage();
  const fromLink = readHash();
  if (fromLink) S.step = 4;
  fullRender();
  const art = $('#art');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]intro=0/.test(location.search);
  if (fromLink || reduce) { art.classList.remove('i-mono'); art.dataset.view = 'main'; }
  else {
    M.runIntro(art, $('#intro'), () => { /* ready */ });
    art.addEventListener('click', () => { if (art.dataset.view === 'intro') M.skip(); });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { shown = 0; fullRender(); }); // tab widths depend on the fonts
  window.SGApp = { state: S, snapshot: () => cur, exportData, loadLib, goStep };
})();

</script>
</body>
</html>
