<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sweetgreen Color Field</title>
<meta name="description" content="Explore new color without leaving the Sweetgreen world.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M16 2a14 14 0 1 1-14 14V2z%27 fill=%27%2300A810%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <b>Color Field</b>
      <small>Explore new color without leaving the Sweetgreen world.</small>
    </div>
    <nav class="nav" aria-label="Main">
      <button data-action="sheet" data-v="about">About</button>
      <button data-action="sheet" data-v="library">Library</button>
      <button data-action="sheet" data-v="technical">Technical</button>
    </nav>
  </header>

  <!-- left: expression, explore, counterparts -->
  <div class="col-left" id="col-left">
    <section class="card" id="expression" aria-labelledby="h-expression">
      <header class="card-head"><span class="num">1</span><div><h2 id="h-expression">Choose an expression</h2><p>Slide between Grounded and Ripe.</p></div></header>
      <div class="bal">
        <div class="bal-row"><span class="bal-end">G</span><input id="balance" type="range" min="0" max="1000" step="1" aria-label="Balance between Grounded and Ripe"><span class="bal-end">R</span></div>
        <div class="bal-zones" id="bal-zones" aria-hidden="true"></div>
      </div>
      <div class="layouts" id="layouts" role="radiogroup" aria-label="Color chip layout"></div>
      <div id="count-note" class="count-note"></div>
    </section>

    <section class="card card-explore" id="explore" aria-labelledby="h-explore">
      <header class="card-head"><span class="num">2</span><div><h2 id="h-explore">Explore color</h2><p id="explore-sub"></p></div></header>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="field-wrap">
        <canvas id="field" width="360" height="200" tabindex="0" role="slider" aria-label="Color field. Horizontal is hue, vertical is lightness. Arrow keys move the selection."></canvas>
        <div class="marker" id="marker"></div>
        <div class="ev-marker" id="ev-marker"><span>Evergreen</span></div>
        <span class="axis axis-y">Lighter ↑</span><span class="axis axis-x">Hue →</span>
      </div>
      <div class="slider-row">
        <div class="slider-body"><span id="intensity-lo"></span><input id="intensity" type="range" min="0" max="100" step="1" aria-labelledby="intensity-lo"><span id="intensity-hi"></span></div>
      </div>
      <div class="test">
        <div class="test-row"><input id="hex-test" type="text" placeholder="Have a color in mind? #E4572E" spellcheck="false" autocomplete="off" aria-label="Check a HEX color"><button data-action="test-hex" class="btn">Check</button></div>
        <div id="test-msg" class="test-msg" role="status" aria-live="polite"></div>
      </div>
      <div class="combo" id="combo"></div>
    </section>

    <section class="card card-cp" id="cp" aria-labelledby="h-cp">
      <header class="card-head cp-head">
        <span class="num num-sm">2.5</span><div><h2 id="h-cp">Explore counterparts</h2><p>Judged against Evergreen.</p></div>
        <button class="btn cp-toggle" id="cp-toggle" data-action="cp-toggle" aria-expanded="false" aria-controls="cp-body">Open</button>
      </header>
      <div class="cp-body" id="cp-body" hidden></div>
    </section>
  </div>

  <!-- center: the colors, once -->
  <main class="stage" id="stage" aria-label="Color stage">
    <div class="stage-inner">
      <div class="stack-wrap" id="stack-wrap">
        <div class="stack" id="stack" role="group" aria-label="Color balance preview">
          <div class="empty" data-empty="top"></div>
          <button class="slot" data-id="r1" data-action="chip"></button>
          <button class="slot" data-id="r2" data-action="chip"></button>
          <button class="slot slot-e" data-id="e" data-action="chip"></button>
          <button class="slot" data-id="g1" data-action="chip"></button>
          <button class="slot" data-id="g2" data-action="chip"></button>
          <div class="empty" data-empty="bottom"></div>
        </div>
        <div class="ax-line" aria-hidden="true"></div>
      </div>
    </div>
  </main>

  <!-- right: apply -->
  <div class="col-right" id="col-right">
    <section class="card" id="apply" aria-labelledby="h-apply">
      <header class="card-head"><span class="num">4</span><div><h2 id="h-apply">Apply</h2><p>How to use these colors.</p></div></header>
      <div id="apply-body"></div>
    </section>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="Sheet" hidden>
  <header class="drawer-head"><h3 id="drawer-title"></h3><button class="mini" data-action="close-sheet" aria-label="Close">Close</button></header>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/color.js"></script>
<script src="js/territories.js"></script>
<script src="js/spectrum.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
