<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweetgreen color farm</title>
<meta name="description" content="Explore new color without leaving the Sweetgreen world.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2716%27 fill=%27%2300A810%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="frame">
<div id="art" class="i-mono" data-view="intro" data-step="1">

  <img class="mk mk-s" id="mk-s" src="assets/brand/s.svg" alt="s" width="21" height="23">
  <img class="mk mk-g" id="mk-g" src="assets/brand/g.svg" alt="g" width="23" height="29">

  <!-- the colors, once -->
  <main id="stage" aria-label="Color stage"></main>

  <!-- main panel: steps 1 to 4 -->
  <section class="panel" id="p-main" aria-label="Color Field steps">
    <div class="in">
      <div class="body">
        <ol class="stepper" id="stepper" aria-label="Steps"></ol>
        <div id="step-body"></div>
      </div>
      <div class="bottom"><div id="bottom-extra"></div><div class="foot" id="foot"></div></div>
    </div>
  </section>

  <!-- about -->
  <section class="panel" id="p-about" aria-label="About">
    <div class="in">
      <div class="about" id="about-text"></div>
      <div class="foot"><button class="btn btn-black grow" data-action="close-sheet">Close</button></div>
    </div>
  </section>

  <!-- library -->
  <section class="panel" id="p-lib" aria-label="Library">
    <div class="in">
      <div class="lib" id="lib-grid"></div>
      <div class="foot"><button class="btn btn-black grow" data-action="close-sheet">Close</button></div>
    </div>
  </section>

  <!-- intro -->
  <div id="intro" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
</div>

<script src="js/color.js"></script>
<script src="js/territories.js"></script>
<script src="js/spectrum.js"></script>
<script src="js/keywords.js"></script>
<script src="js/engine.js"></script>
<script src="js/motion.js"></script>
<script src="js/app.js"></script>
</body>
</html>
